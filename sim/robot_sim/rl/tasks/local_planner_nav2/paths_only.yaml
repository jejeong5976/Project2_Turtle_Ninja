# 경로 만들기 전용 (smac2d_planners.yaml 다음에 읽음): 실제 시계 · 라이다 층 뺌
#   global_costmap = static + inflation 만 (학습 경로는 정적 지도 경로, 사람 · 장애물은 env 가 따로 놓음)
planner_server:
  ros__parameters:
    use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      plugins: ["static_layer", "inflation_layer"]

map_server:
  ros__parameters:
    use_sim_time: false
