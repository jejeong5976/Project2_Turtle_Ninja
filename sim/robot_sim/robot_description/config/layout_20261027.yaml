# 배치 수정 (2026-10-27) — tools/apply_layout.py 가 읽음. 좌표: base_link, +x 앞(앞 라이다 쪽), +y 왼쪽, z 위. 단위 m.
# 근거 표시: [실측] 사용자 줄자 · [CAD] 기존 메시 · [계산] · [사진] · [추정]

lidar:
  ground_z_in_base_m: -0.072                 # [계산] 조향축 z −0.039 − 바퀴 반지름 0.033 (base_footprint 와 같음)
  model_plate_underside_base_m: -0.0604      # [CAD] bottom_plate 메시 아랫면 (바닥 위 11.6 mm)
  model_lidar_mount_base_m: -0.0514          # [CAD] lidar_*_mount z = 판 윗면 (바닥 위 20.6 mm)
  measured_plate_underside_ground_m: 0.020   # [실측] 라이다 와플판 밑면 20 mm (2026-10-27)
  measured_scan_plane_ground_m: 0.060        # [실측] 라이다 스캔면 60 mm (2026-10-27)
  front_rear_same_height: "[사진] IMG_9624/9625: 두 LDS 모두 같은 맨 아래 판에 스페이서 없이 볼트 고정. 뒤 라이다 높이 별도 실측은 없음 → 같은 값 적용은 추정"
  not_changed: "x·y·yaw(90°/270°)·라이다 메시 그대로. FL0_LiDAR_Spec.md(CAD 사양서, 원점=FL0 판 윗면, 스캔 +26.5, yaw 180/0 잠정)는 기준이 달라 덮어쓰지 않음"

reference_surfaces:                          # [실측] 2026-10-27 사용자: 밑면(방금) / 윗면(기존 값). 바닥 기준 m
  arm_plate:     {underside: 0.159, top: 0.165, model_underside: 0.1545, model_top: 0.1635, action: "그대로(윗면 차 1.5 mm, 팔 전체 위치에 영향)"}
  opencr_plate:  {underside: 0.110, top: 0.120, model_underside: 0.1095, model_top: 0.1185, action: "그대로(윗면 차 1.5 mm)"}
  battery_plate: {underside: 0.075, top: 0.080, model_underside: 0.062,  model_top: 0.071,  action: "윗면 80 mm 에 맞춰 +9 mm (배터리도 +9 mm)"}
  lidar_plate:   {underside: 0.020, model_underside: 0.0116, action: "밑면 20 mm 에 맞춰 +8.4 mm"}
  note: "실물 판 두께 5~10 mm, 모델 판 두께 9 mm(CAD). 판 두께는 바꾸지 않음 → 배터리판 밑면은 71 mm(실측 75), 라이다판 윗면 29 mm(실물 약 25 추정)"

battery_plate:
  mesh_in: meshes/generated/base_without_arm_top_plate.obj
  mesh_out: meshes/generated/base_without_arm_top_plate_layout.obj
  component_z_band_base_m: [-0.0106, -0.0004]   # 이 z 범위 안에만 있는 연결 조각 (아래 expected_components 참고)
  expected_components: 13   # 판 1덩어리(4조각이 꼭짓점 공유, 47,232면) + 판 아래 나사 12개 (나사 4개는 다른 부품과 이어져 제외)
  model_top_base_m: -0.001
  measured_top_ground_m: 0.080
  battery_joint: battery_mount
  structure_check: "조향 모터 4개(28x46 mm, 바닥 69~110 mm)는 배터리판을 관통해 OpenCR 판 아래까지 → 판을 올려도 간섭 없음. 배터리 위끝 107.6 mm < OpenCR 판 밑면 110 mm"
  not_moved: "판을 가로지르는 기둥·나사(아래 −43~−10, 위 −5.5~39.5 등)는 그대로 → 보기에서 기둥 길이가 맞지 않을 수 있음(물리 영향 없음, 차체 충돌은 base_link 한 덩어리)"

boards:
  # 근거: placement_photo_20261027/BOARD_EVIDENCE_MAP.json, IMG_9771(x 방향 줄자)·IMG_9772(y 방향 줄자), 주석 사진 robot_top_layout_annotated.jpg,
  #       OpenCR REV.H 공식 STL/BOM/XY(IMU U9 = MPU-9250, PCB 정중앙, 가속·자이로 X=−보드X, Y=−보드Y).
  # 사진(원근 미보정)에서 읽은 xy 는 ±10 mm 수준 [사진]. 보드별 개별 yaw 는 확정 못 함 → 메시 방향(USB −y, 사진과 일치) 유지.
  # z(스탠드오프)는 확정 못 함 → 두 OpenCR 모두 기존 opencr_1 메시의 PCB 윗면 55.28 mm(base) 사용 [추정]. opencr_2 는 판(46.5)을 4.2 mm 파고들던 것이 해소됨.
  - {name: OpenCR2_drive, visual: base_link__visual__v5_opencr_2_geometry_mass_in_base_0_5, xyz: [0.001, 0.145, 0.0075], rpy: [0, 0, 0],
     result_pcb_center_base: [0.001, 0.075, 0.05528], note: "왼쪽 앞, 주행·바퀴 보드 [사용자 확정]. 메시 PCB 중심 (0,−70)→(+1,+75) mm"}
  - {name: OpenCR1_arm, visual: base_link__visual__v5_opencr_1_geometry_mass_in_base_0_4, xyz: [-0.1025, 0.0166, 0.0], rpy: [0, 0, 0],
     result_pcb_center_base: [-0.092, 0.035, 0.05528], note: "왼쪽 뒤, 팔 보드 역할은 추정. 메시 PCB 중심 (10.5,18.4)→(−92,+35) mm"}
  - {name: imu_link, joint: imu_link_fixed, xyz: [0.001, 0.075, 0.0558], rpy: [0, 0, 1.5707963],
     note: "주행 OpenCR② 의 MPU-9250(PCB 중심, 칩 윗면 PCB+1.02 mm). 축: 보드 yaw −90° + 칩 X=−보드X → 로봇 기준 +90°. 펌웨어는 축을 그대로 넘김. ICM-20648 보드면 다를 수 있음 → 정지 상태에서 앞을 숙여 acc[1] 이 + 로 가는지 확인"}
  - {name: Jetson, joint: jetson_planned_mount, xyz: [-0.0054, -0.0475, -0.007617], rpy: [0, 0, -1.5707963],
     note: "오른쪽. 캐리어 중심 ≈(+13,−58) mm, I/O 가 −y 를 향하도록 −90°. z 는 기존(판 위 바로) 유지 [추정]. 충돌 상자도 같이 이동 (x −38.5~64.5, y −99.4~−8.5, z 46.5~81.27)"}
  - {name: lidar_jetson_interface_board, new_link: lidar_jetson_interface_board_link, xyz: [0.110, 0.049, 0.0475], rpy: [0, 0, 0],
     box: [0.015, 0.031, 0.002], note: "왼쪽 앞, 위치 표시용 시각 상자만. 질량·충돌 없음. 크기·z 는 사진 추정"}
open_board_items: "보드별 스탠드오프 높이(PCB 윗면−판 윗면), Jetson 스탠드오프, 보드별 미세 yaw, ±10 mm 보다 정확한 xy. IMG_9771 뒤 왼쪽의 두 번째 작은 초록 보드(뒤 라이다 어댑터로 추정)는 넣지 않음"

finger_collision:
  # 손가락 a·b 충돌을 보이는 모양에서 CoACD 로 다시 만든 조각으로 교체(tools/make_finger_collision.py → config/finger_collision.json).
  # 이유: 기존 근사가 거칠어 parked+16 mm 에서 손가락끼리 4.8 mm 겹침, 받침 벽 관통 → 시뮬 그리퍼가 21.3 mm 에서 멈추고, 겹침을 끄면 한계를 넘어 폭주.
  # 받침(gripper_park_stand_TEMP) 충돌은 그대로.
  file: config/finger_collision.json

gripper:
  # 실측 간격(16 닫힘 · 79 열림)은 고무패드 안쪽끼리. 모델 손가락에는 패드가 없음 → 모델 금속 간격 = 실측 + 2 × 패드 두께.
  # 패드 두께는 미측정 → 1.5 mm(한쪽) 가정: 기존 형상에서 닫힘 시 손가락끼리 2.5 mm 겹치던 것을 0.5 mm 틈으로. 실측하면 이 값만 바꿈.
  pad_per_side_m: 0.0      # CAD 손가락에 고무패드 포함(사용자 확인) → 실측 패드 간격 = 모델 간격
  gap0_mm: 58.50723799617533          # q = 0 일 때 모델 금속 간격 (joint_map.json)
  closed_pad_gap_mm: 16.0
  open_pad_gap_mm: 79.0
  joints: [gripper_finger_a_joint, gripper_finger_b_joint]

park_stand_collision:
  # 실물: 평행하게 닫힌 그리퍼(패드 16 mm)가 받침에 닿지 않고 들어감. 모델 받침(임시 상자, 바깥 53×50, 벽 3 mm)은 그대로 두고
  # 위치만 그리퍼 중심에 맞춤: parked + 16 mm 에서 받침 안 손가락(보이는 모양) 범위 x −12.13~23.33, y −20.26~22.56 mm
  # → 좌우 중심 +1.15 mm(양쪽 틈 0.6 mm), 앞쪽 +0.5 mm(앞 벽 틈 0.67 mm). 사진 위치 추정 오차 안.
  link: gripper_park_stand_TEMP
  mount_joint: gripper_park_stand_mount
  mount_shift_m: [0.0005, 0.00115, 0.0]
  # 충돌 벽 윗부분 4.5 mm 낮춤(33 → 28.5 mm): 손가락은 벽 위를 살짝 넘어가는 모양인데 볼록 충돌 조각이 그 모서리를 메워
  # 벽 맨 위 4 mm(28.8~33 mm)에서만 0.7~1.4 mm 겹침. 손가락 아랫부분(9~28 mm)은 벽이 그대로 좌우를 잡음. 보이는 모양·바깥 크기 그대로.
  walls:
    - {name: gripper_park_stand_TEMP__collision__wall0, xyz: [0.025, 0.0, 0.01725], size: [0.003, 0.050, 0.0225]}
    - {name: gripper_park_stand_TEMP__collision__wall1, xyz: [-0.025, 0.0, 0.01725], size: [0.003, 0.050, 0.0225]}
    - {name: gripper_park_stand_TEMP__collision__wall2, xyz: [0.0, 0.0235, 0.01725], size: [0.047, 0.003, 0.0225]}
    - {name: gripper_park_stand_TEMP__collision__wall3, xyz: [0.0, -0.0235, 0.01725], size: [0.047, 0.003, 0.0225]}
