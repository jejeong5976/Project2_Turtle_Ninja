# planning.yaml — planning_master 설정표

planning_master:
  ros__parameters:
    dry_run: true            # true = 로봇·카메라 없이 흐름만 (인지·이동은 시간 지나면 저절로 넘어감)
    dry_run_step_s: 1.5      # dry_run 에서 한 단계에 머무는 시간 [s]
    dry_run_pucks: 2         # dry_run 에서 옮길 퍽 수
    control_timeout_s: 1.0   # /odom 이 이만큼 끊기면 FAULT

    # 팔 작업 (ArmTask) 시간 제한
    arm_retry_s: 15.0          # 거절되면 이 시간 동안 1 s 마다 다시 보냄 (켤 때 팔 재생기 준비 기다리기)
    arm_accept_timeout_s: 5.0  # "받았다" 답이 이만큼 안 오면 FAULT
    arm_result_timeout_s: 60.0 # "끝났다" 답이 이만큼 안 오면 취소 + FAULT (PICK = 4 s × 5동작 + 바퀴 세우기)
