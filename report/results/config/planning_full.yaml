mission_manager:
  ros__parameters:
    dice_map: ''
    travel_table: ''
    barcode_table: ''
    collect_order:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 3
    look_dwell_s: 1.0
    dice_pick_fresh_s: 90.0
    transfer_max_remaining: 4
    verify_radius_m: 0.18
    verify_cell_tol_m: 0.05           # 칸 중심에서 이 안이면 칸 위 (눈 위치 허용 ±5 cm)
    verify_vote_ratio: 0.7
    record_dir: ~/planning_logs
    max_replans: 15
    map_frame: map
    base_frame: base_link
    odom_frame: odom
    tick_hz: 10.0
    time_limit_s: 0.0
    return_margin_s: 60.0
    detection_max_age_s: 0.5
    min_confidence: 0.5
    candidate_max_age_s: 30.0
    signal_timeout_s: 1.0
    signal_record: true
    barcode_look: true
    barcode_enable_service: /perception/barcode/enable
    wide_enable_service: /perception/wide/enable
    wide_capture_service: /wide_cam/set_capture
    signal_wait_s: 90.0
    signal_retries: 0
    signal_expected: 12
    signal_min_on_s: 0.3
    signal_min_off_s: 0.25
    signal_end_off_s: 2.5
    signal_max_gap_s: 0.8
    signal_majority: 0.8
    signal_max_ambiguous: 0.3
    signal_min_count: 1
    signal_max_count: 6
