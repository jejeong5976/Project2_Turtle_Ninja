# Nav2 설정 (ros2_ws/src/navigation/launch/nav2.launch.py 가 읽음, bringup 이 share/bringup/config 로 설치)
# 바탕: /opt/ros/lyrical/share/nav2_bringup/params/nav2_params.yaml. 바꾼 것만 주석
#   - 4륜 스워브 = 홀로노믹: AMCL OmniMotionModel, MPPI omni 모델 (vy 사용), 앞으로만 가기 비용 뺌
#   - 속도 · 가속 = 배포판 swerve.yaml limits_for_training (0.26 m/s · 1.675 rad/s, 1.0 m/s² · 6.0 rad/s²)
#   - 차체 외곽 = ±0.16 m 사각형 (차체 0.266 m + 바퀴 · 라이다, 받침 자세 팔은 차체 안)
#   - 라이다 = /lidar_front/scan, /lidar_rear/scan (시뮬 브리지와 실물 드라이버 같은 이름으로 앎, 사용자 2026-11-01. 실물 ros2 topic list 로 최종 확인)
#   - 프레임: map / odom / base_link (AMCL 은 base_footprint). 지도 해상도 0.025 m 에 맞춤
#   - 비상 정지 collision_monitor: controller · behavior 의 cmd_vel_nav -> collision_monitor -> /cmd_vel (사람이 갑자기 앞에 서면 멈춤)
#   - 쓰지 않는 노드(route · docking · following · velocity_smoother · smoother) 설정은 뺌
# use_sim_time 은 launch 인자로 줌 (시뮬 true, 실물 false). 시뮬 시험 기준 값이라 실물 주행 후 다시 맞출 것

amcl:
  ros__parameters:
    # 오도메트리 잡음 [추정]. 시뮬 /odom 은 정답이라 작게. 실물은 바퀴 + IMU 오도메트리 주행 시험 후 정할 것
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: 8.0           # LDS-03
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    max_beams: 90
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    random_seed: -1
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"   # 스워브 = 홀로노믹 (설치된 모델은 Differential · Omni 둘뿐)
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 0.5
    introspection_mode: "disabled"
    update_min_a: 0.1              # 작은 경기장이라 자주 갱신
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /lidar_front/scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    introspection_mode: "disabled"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1667
      search_window: 2.0
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1669
      search_window: 2.0
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees
    error_code_name_prefixes:
      - backup
      - compute_path
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - spin
      - wait

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # 홀로노믹: 옆 속도도 씀 (기본 0.5 는 차동구동용)
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    path_handler_plugins: ["PathHandler"]
    use_realtime_priority: false
    speed_limit_topic: "speed_limit"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2   # 최고 0.26 m/s 라 기본 0.5 m / 10 s 는 너무 큼
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05         # 퍽 앞 정렬 전 단계라 5 cm (planning 이 그 뒤 정밀 접근)
      yaw_goal_tolerance: 0.10
      path_length_tolerance: 1.0
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 1.0
      enforce_path_inversion: false
      enforce_path_rotation: false
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      reject_unit_path: false
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      model_delay_vx: 0.0
      model_delay_vy: 0.0
      model_delay_wz: 0.0
      batch_size: 2000
      open_loop: false
      # 가속 · 속도 = swerve.yaml limits_for_training (스워브 컨트롤러가 같은 한계를 다시 지킴)
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 1.0
      ay_min: -1.0
      az_max: 6.0
      vx_std: 0.15
      vy_std: 0.15
      wz_std: 0.4
      vx_max: 0.26
      vx_min: -0.26
      vy_max: 0.26
      wz_max: 1.6
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      visualize: true
      publish_optimal_trajectory: true
      regenerate_noises: true
      motion_model: "omni"           # 홀로노믹 (vx, vy, wz). 조향 지연은 모델에 없음
      omni:
        plugin: "mppi::OmniMotionModel"
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: true
      # PreferForwardCritic 뺌 (앞뒤 · 옆 모두 같은 주행)
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true      # 사각 외곽으로 충돌 검사
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.4
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.0
        mode: 1                      # 1 = NO_DIRECTIONAL_PREFERENCE (앞뒤 방향 선호 없음, 홀로노믹)

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025
      footprint: "[[0.16, 0.16], [0.16, -0.16], [-0.16, -0.16], [-0.16, 0.16]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front rear
        front:
          topic: /lidar_front/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        rear:
          topic: /lidar_rear/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0     # 통로 폭 약 0.7 m - 차체 0.32 m -> 양쪽 여유 약 0.19 m. 비용은 빠르게 줄어듦
        inflation_radius: 0.25        # 외곽 외접원 0.24 m 이상 (MPPI 외곽 충돌 검사 최적화 조건)
      always_send_full_costmap: true
      introspection_mode: "disabled"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.16, 0.16], [0.16, -0.16], [-0.16, -0.16], [-0.16, 0.16]]"
      footprint_padding: 0.01
      resolution: 0.025
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front rear
        front:
          topic: /lidar_front/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        rear:
          topic: /lidar_rear/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.25
      always_send_full_costmap: true
      introspection_mode: "disabled"

map_server:
  ros__parameters:
    introspection_mode: "disabled"   # yaml_filename 은 launch 인자 map

planner_server:
  ros__parameters:
    allow_partial_planning: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    introspection_mode: "disabled"
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.1
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      acceleration_limit: 1.0
      deceleration_limit: -1.0
      minimum_speed: 0.05
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      acceleration_limit: 1.0
      deceleration_limit: -1.0
      minimum_speed: 0.05
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# 비상 정지 (Nav2 명령과 스워브 사이). 앞뒤 라이다 둘 다 봄 (라이다 높이 60 mm = 사람 발 · 신발 높이)
#   FootprintApproach: 지금 명령 속도(vx, vy, wz)로 차체 외곽을 1.0 s 앞까지 굴려 보고, 그 안에 장애물이 있으면 부딪히기 전에 서도록 속도를 줄임
#                      (홀로노믹이라 옆 · 뒤 · 사선 이동도 그 방향으로 검사. 0.26 m/s 면 약 26 cm 앞)
#   PolygonStop: 차체 외곽 + 2 cm 안에 점이 들어오면 즉시 0 (2026-11-02 +4 → +2 cm: 박스 · 장소 정차점에서 박스 가장자리 0.191 m 라 +4 cm 면 정차 때 걸림.
#                통로 폭 약 0.7 m 에서 벽까지 여유 약 0.19 m 라 벽에는 안 걸림)
#   실물: 라이다가 자기 바퀴 · 기둥을 보면 (외곽에서 0.08–0.15 m) 정지 구역에 걸려 계속 멈춤 -> 실물 스캔은 몸에 맞은 점을 걸러야 함 (laser_filters 등)
collision_monitor:
  ros__parameters:
    enabled: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_safe"   # → cmd_vel_hold (/mission/hold 문) → /cmd_vel
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach", "PolygonStop"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.0
      simulation_time_step: 0.05
      min_points: 2
      visualize: false
      enabled: true
    PolygonStop:
      type: "polygon"
      action_type: "stop"
      points: "[[0.18, 0.18], [0.18, -0.18], [-0.18, -0.18], [-0.18, 0.18]]"   # 외곽 0.16 + 2 cm (2026-11-02, 옛 ±0.21). 박스 · 장소 정차점 (중심에서 0.2935 m) 에서 박스 가장자리 0.191 m 보다 작아야 정차 때 안 걸림 (Isaac 시험에서 ±0.21 이면 B5 · L1 앞 비상 정지)
      min_points: 2
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    observation_sources: ["front", "rear"]
    front:
      type: "scan"
      topic: "/lidar_front/scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true
    rear:
      type: "scan"
      topic: "/lidar_rear/scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true
