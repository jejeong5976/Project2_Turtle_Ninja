# control.yaml — control_master 설정표 (팔 · 차례)
# 바퀴 설정은 config/controllers.yaml 의 swerve_controller 에 (바퀴 계산이 ros2_control 컨트롤러 안이라서, D8).

control_master:
  ros__parameters:
    rate_hz: 50.0                  # 차례 · 팔 진행 확인 주기

    # =========================== 팔 ===========================
    # 관절: joint1(몸통 회전) joint2(어깨) joint3(팔꿈치) joint4(손목 굽힘) joint5(손목 비틀기). 단위 rad
    # 그리퍼: gripper_left_joint, 단위 m (손가락 이동 거리, OpenManipulator-X 와 같음)
    arm_joints: [joint1, joint2, joint3, joint4, joint5]
    gripper_joint: gripper_left_joint
    move_time_s: 4.0               # 동작 하나에 걸리는 시간 (느리게 = 전류 작음, D16)
    accept_timeout_s: 2.0          # 재생기(JTC)가 동작을 받아 주기까지 기다리는 최대 시간
    motion_margin_s: 3.0           # move_time_s 보다 이만큼 더 걸리면 시간 초과 → 취소 + 실패
    # 속도 [°/s] · 가속 [°/s²] (작업마다 다시 읽음, 실행 중 ros2 param set 은 다음 작업부터)
    #   11-06 사용자: 실물은 2.5 배 빠르게 → 25 · 25 · 25 · 60 · 150 을 2.5 배. 시뮬 (받침 세우기, 이 속도) 8 중 8
    #   ⚠ 가속을 올리면 모터 전류가 큼 (J4 과부하 주의) — 실물 첫 시험은 지켜보며. 되돌리기: 25 · 25 · 25 · 60 · 150
    near_puck_speed_dps: 62.5      # PICK · PLACE 의 퍽 위 내림 · 쥐기 · 다시 쥐기
    path_slow_min_dps: 62.5        # 실물 경로 (arm_paths.yaml) 칸 근처 느린 구간 (기록 15) 의 최소 속도. 0 = 기록 그대로
    path_stand_speed_dps: 62.5     # 받침 근처 (접기 · 펴기) 구간
    path_speed_dps: 150.0          # 빈 공간 최고 속도
    path_accel_dps2: 375.0         # 가속 · 감속 (짧은 구간도 실제로 빨라지게 속도와 같이 올림)
    # 미션 시간 줄이기 (11-06): 빈손 그리퍼 동작은 팔을 멈추지 않고 (PICK 퍽 위로 가며 열기 · STORE 놓은 뒤 받침 쪽 가며 닫기),
    #   퍽을 쥐거나 놓을 때만 그리퍼를 기다림 (gripper_time_s 1.2 → 0.7)
    gripper_on_the_way: true
    #   가짜 로봇 STORE S7 (칸 근처 · 받침): 25.1 s (15 · 20) → 21.8 s (25 · 20) · 20.2 s (25 · 30)
    cancel_timeout_s: 2.0          # 취소를 보내고 재생기가 "멈췄다" 고 답하기를 기다리는 최대 시간 (취소 요청 ≠ 실제 정지)
    # ---- 접힘 실측 확인 — 바퀴를 푸는 조건 ----
    #   마지막 home 동작 뒤, 측정 시각이 새로운 /joint_states 의 joint1~5 가 poses.home ± fold_tolerance 안에
    #   fold_hold_s 동안 머물러야 DRIVE. verify_timeout_s 안에 안 되면 팔 작업 실패 → STOP
    #   ⚠ 값은 잠정 — 실물 HOME 의 처짐 · 분해능을 재고 정할 것 (너무 작으면 정상인데도 실패, 너무 크면 덜 접혀도 통과)
    verify_timeout_s: 2.0
    fold_tolerance: [0.05]         # [rad] 하나만 주면 모든 관절 같은 값. 관절마다 다르게: [j1, j2, j3, j4, j5]
    fold_hold_s: 0.3               # [s]
    fold_max_age_s: 0.2            # [s] 이보다 오래된 측정으로는 확인 안 함
    # 하드웨어 이상 → STOP + HOME 확인 무효 (arm.cpp HardwareWatch)
    #   팔 관절 측정이 hw_state_timeout_s 넘게 안 오거나, NaN(못 읽음)이 hw_bad_hold_s 넘게 이어지면
    #   ⚠ 잠정값 — 너무 작으면 측정 한두 번 빠질 때마다 HOME 을 다시 해야 하고, 너무 크면 고장 뒤 잠금이 늦어짐
    hw_state_timeout_s: 0.3        # [s] joint_state_broadcaster 는 100 Hz
    hw_bad_hold_s: 0.1             # [s] 하드웨어는 0.05 s 넘게 못 읽은 모터를 NaN 으로 냄 (measure_max_age_s)
    # 보드 2장: 보드 상태를 controller_manager 에 직접 물음 — 하나라도 active 가 아니면 STOP
    hw_component_hz: 5.0           # [Hz] 묻는 빈도 (응답 대기 중인 요청은 하나만)
    hw_component_timeout_s: 1.0    # [s] 이만큼 답이 없으면 "모름" = 이상 (0 이하 = 보드 상태 안 봄)
    # 측정을 볼 관절. 기본 = 주행 8 + 팔 6 전부. 책상 시험에서 모터 일부만 쓰면 그 관절만 남길 것
    hw_watch_joints: [drive_fl_joint, drive_fr_joint, drive_rl_joint, drive_rr_joint,
                      steer_fl_joint, steer_fr_joint, steer_rl_joint, steer_rr_joint,
                      joint1, joint2, joint3, joint4, joint5, gripper_left_joint]
    gripper_time_s: 0.7            # 그리퍼 한 동작 시간 [s] (기본 1.2, 11-06 미션 시간 줄이기). 쥐기가 덜 되면 1.0 으로
    gripper_open: 0.0164           # [m] 실측 기준: 닫힘(약 3478 틱) + 1000 틱 = 간격 약 50 mm (scale 0.01149 · zero 3549)
    gripper_close: -0.0016         # [m] 실측 기준: 닫힘 − 20 틱 (퍽이 있으면 전류 한계로 그 전에 멈춤 = 쥠)
    # 나중에 접기: STORE · PLACE 를 P0 (받침 바로 위) 에서 끝냄 → 다음 팔 작업이 접기 · 펼치기 (약 10 s) 를 건너뜀. 주행 전 HOME 이 접음
    #   P0 에서 약 15 s 버티면 팔 모터 과열 Hardware Error (11-03 실물) → lazy_fold_idle_s 동안 다음 작업이 없으면 스스로 접음
    lazy_fold: true
    lazy_fold_idle_s: 5.0            # planning 이 다음 작업을 보내는 틈 (LOOK 기다림 등) 보다 길게, 과열 (약 15 s) 보다 짧게
    # 쥐는 깊이 [mm, 퍽 윗면 기준 손끝]: 위 · 내림 · 쥐기. 실물에서 명령 −40 이 실제 약 30 mm 만 쥠 (윗면 높이를 약 1 cm 높게 봄) →
    #   적재함 경로 (실제 40 mm 로 쥔 퍽으로 가르침) 와 맞게 명령 −50. 기울인 손은 40 (실제 약 30 = 퍽 무게중심)
    pick_heights_mm: [40.0, 10.0, -50.0]
    pick_tilted_depth_mm: 40.0
    # PICK 쥐는 점 보정 [mm, base_link] — 윗면 태그가 안 보인 퍽만 (태그 보인 퍽은 인지가 태그로 중심 · 면 방향을 잡음)
    #   손목 인지 깊이 평균이 퍽 중심을 앞으로 · 왼쪽으로 밀어 잡음 (태그와 비교 9.6 · 1.7 mm). 실물에서 집어 S12 에 넣기까지 된 값
    #   실행 중 바꾸기: ros2 param set /control_master pick_offset_x_mm <값>
    pick_offset_x_mm: -12.0
    pick_offset_y_mm: -3.5
    # 윗면 태그로 잰 퍽 (인지 중심 2 mm 안) 은 팔 쪽 치우침만 — 실물에서 태그 퍽을 집어 맞춘 값 (몸쪽 17 mm)
    pick_offset_tagged_x_mm: 0.0          # 11-06: 카메라 회전을 고친 뒤 (f8adc21) 0 으로 시험 중 (고치기 전 -17 은 카메라 오차를 메운 값)
    # 손목을 90° 돌려 쥘 때 더할 보정 [앞, 왼쪽] mm (팔 바로 앞 퍽 기준, 다른 각도 · 자리는 계산). 실물에서 돌려 쥔 뒤 어긋난 만큼 넣기
    #   11-04 실물: −73° 돌려 쥐니 손가락이 2 mm 오른쪽 → [0.4, 2.4] (그 뒤 −38° 쥐기 "완벽"). 실행 중에만 넣어 11-05 재시작 때 0 으로 돌아감 → 설정에 넣음
    pick_offset_rot_mm: [0.4, -7.6]   # 11-07 실물: 시계 방향 (−90°) 으로 돌려 쥐니 10 mm 더 오른쪽으로 가야 함 → 왼쪽 성분 −10 (카메라 회전을 고친 뒤)
    pick_offset_tagged_y_mm: 0.0
    # 누운 퍽 위 옆면 태그로 잰 중심 (11-06 perception tag_lying_refine): 11-06 실물 PICK 으로 x 를 맞춤 (y 는 아직 0)
    #   받침 세우기는 긴축 방향 ±2 mm 안이 필요 (시뮬). 태그 안 보인 누운 퍽은 pick_offset_x/y (깊이 점 중심)
    pick_offset_lying_tagged_x_mm: -5.0    # 11-06 실물, 카메라 회전을 고친 뒤 (f8adc21): 0 이면 조금 앞에서 쥠, -5 로 세우기 됨 (고치기 전 -25 는 카메라 오차를 메운 값)
    pick_offset_lying_tagged_y_mm: 0.0
    # 태그가 안 보인 누운 퍽 (깊이 점 중심) — 11-06 전까지는 선 퍽 pick_offset_x/y 를 같이 씀 → 같은 값으로 시작, 실물로 맞출 것
    pick_offset_lying_x_mm: -12.0
    pick_offset_lying_y_mm: -3.5
    # STORE 칸 근처 경로 보정 [mm, base_link, x+ = 앞 · y+ = 왼쪽, 15 까지] — 쥔 퍽이 칸에서 늘 한쪽으로 걸리면. 실행 중 ros2 param set 으로 바꿈
    # 수직 손이 안 닿는 먼 퍽: 손을 10° 씩 이만큼까지 바깥으로 기울여 쥠 (박스 끝 모서리 0.32 m 는 40°). 기울여 쥔 퍽은 다시 잡기로 세움
    pick_max_tilt_deg: 40.0
    store_offset_x_mm: 0.0
    store_offset_y_mm: 0.0
    # 칸마다 더하는 STORE 보정 [x, y] mm (없는 칸 = 0). 실행 중: ros2 param set /control_master store_offset.S7 "[0.0, 5.0]"
    store_offset:
      # 11-06 새 적재함 · 카메라 회전을 고친 뒤 실물: 오른쪽 4 칸 (S4 · S7 · S9 · S12) 은 로봇 앞으로 놓임 (스캔으로 잰 칸은 칸 표와 x 3.4 mm 안 → 팔 쪽 차이)
      #   S12 는 칸 근처 합계 (-10, +2.5) mm 에서 들어감 (그때 접근축 1° 한도로 -20 의 50 % 만 옮겨짐). 나머지는 x 를 -10 mm 로 시작해 실물로 맞출 것
      S12: [-10.6, -4.3]  # 옛: [-0.6, -1.8] (넣는 점 맞추기 (+0.6, +6.8) 에 더해 합계 (0, +5) 에서 들어감)
      S9: [0.7, -2.0]     # 11-06 실물, 선 퍽 (pick det) 성공: 칸 근처 합계 (-6.7, +8.0). 세운 퍽으로는 (-11.7, +3.0) 에서 들어갔음. 옛: [4.0, -4.0]
      S4: [-10.0, -4.0]   # 11-07 실물 선 퍽: [-6, -4] 이면 박스 쪽 (앞) 으로 4 mm. 옛: [4.0, -4.0]
      S7: [-10.0, 0.0]    # 11-07 실물 선 퍽 성공
      # 왼쪽 8 칸: 11-07 실물 선 퍽으로 S1 · S2 가 왼쪽 4 · 앞 3 mm → 왼쪽 조각 모두 (-3, -4) 더함
      S10: [1.0, 0.0]     # 옛: [4.0, 4.0] (11-04 실물, S9 · S4 대칭)
      S5: [1.0, 0.0]      # 옛: [4.0, 4.0]
      S1: [-3.0, -4.0]
      S2: [-3.0, -4.0]
      S3: [-3.0, -4.0]
      S6: [-3.0, -4.0]
      S8: [-3.0, -4.0]
      S11: [-3.0, -4.0]
    # 넣는 점 맞추기: 경로의 놓는 점을 팔 모델로 칸 표 (config/rack_cells.yaml 칸 중심 + place_offset) 로 옮김 (칸마다 자동, 위 보정은 그 위에 더함)
    store_to_cell: true
    # 쥔 퍽 손 안 위치 (손목 카메라, rack_tag_node 를 띄워야 잼): false = STORE 때 로그만, true = 기준과 차이만큼 칸 근처 경로를 옮김
    #   기준: STORE 가 잘 들어간 PICK 뒤 (넣기 전, 기준점에서) ros2 service call /control_master/save_held_reference std_srvs/srv/Trigger
    held_correct: false
    # 손목 카메라가 손목에서 돈 만큼 손목 검출을 되돌림 (camera_drift_node 의 /wrist_cam/drift, 아래 camera_drift_node 설명)
    wrist_cam_drift_correct: true
    # 누운 네모 퍽 PICK 때 세움 (경로 표 config/standup_paths.txt, Isaac 강화학습 → 피드백 없이 재생). false = 누운 채 PICK (예전)
    #   실물 첫 시험: ros2 param set /control_master stand_lying true → 누운 네모 퍽 pick det
    # 누운 퍽 쥐기 [mm, 누운 윗면 기준]: 위 · 내림 · 쥐기. 실물은 명령보다 약 10 mm 얕게 쥠 (11-05: −20 은 끝만 걸침, −30 도 얕음) → −45
    pick_lying_heights_mm: [40.0, 10.0, -45.0]
    pick_lying_tip_clear_mm: -15.0   # 쥐기 깊이 한도: 손끝이 놓인 면 아래 15 mm (모델) = 실제 약 −5 mm (11-05 실물 −45 로 쥠 확인)
    stand_lying: true    # 11-05 사용자: 다시 켤 때마다 켜지 않게 기본 켬
    # 세우는 방법: park = 그리퍼 받침에 기울여 넣고 손가락으로 밀어 세운 뒤 다시 쥠 (시뮬 깊이 35 · 2.5 배 속도 8 중 8),
    #   table = 강화학습 표 재생 (박스 위, 시뮬 재생 77 ~ 84 %)
    stand_lying_mode: park
    park_center: [0.1008, 0.00115]   # 그리퍼 받침 중심 [m, base_link]
    park_floor_z: 0.1365             # 받침 바닥 윗면 [m, base_link]
    park_tilt_deg: 45.0              # 넣을 때 손 기울임 (안 되면 5° 씩 40 까지). 받침 위에서 가까운 퍽은 50° 까지, 기울여 쥔 먼 퍽은 40° 까지 IK
    park_grasp_offset_mm: 25.0       # 누운 퍽을 끝 쪽으로 옮겨 쥠
    park_insert_clear_mm: 4.0        # 놓을 때 퍽 가장 낮은 모서리 ↔ 받침 바닥 (11-06 실물: 2 면 넣다 걸려 밀려 나옴, 20 이면 떨어지며 뒤로 넘어감)
    park_end_inset_mm: -3.0          # 아래 끝면 중심 = 받침 중심에서 J1 쪽으로 이만큼 (음수 = 바깥). 11-06 실물 (받침을 넓힌 뒤): 4 면 팔 쪽 벽에 걸려 -3 으로 맞춤
    park_push_h_mm: 25.0             # 미는 손끝 높이 (받침 바닥 위)
    park_regrasp_depth_mm: 30.0      # 선 퍽 다시 쥐기 깊이 (손끝이 받침 벽 위)
    park_regrasp_r_mm: 0.0           # 선 퍽 다시 쥐는 자리 = 받침 중심에서 반지름 방향 (− = J1 쪽). 시뮬 -6, 11-06 실물 (받침 넓힌 뒤): 0 = 받침 중심에서 쥐면 맞음 (-10 · -16 은 앞쪽을 쥠, -26 부터는 IK 안 됨)
    park_speed_dps: 50.0             # 넣기 · 다시 쥐기 (2.5 배)
    park_push_speed_dps: 20.0        # 밀어 세우기만 천천히 (11-06 시뮬: 50 이면 ±2 mm 오차에 12 중 6–8, 20 이면 12 중 12)
    park_max_tilt_deg: 30.0          # 먼 누운 퍽: 쥘 때 손을 10° 씩 이만큼까지 기울임 (접선 방향 퍽은 그만큼 굴러 손가락에 맞음)
    park_roll_margin_mm: 2.5         # 굴려 쥘 때 열린 손가락 ↔ 퍽 최소 여유
    park_max_roll_deg: 12.0          # 굴려 쥐기 최대 (시뮬: 10° 됨, 20° 는 들다 놓침)
    # LOOK_RACK (퍽 쥔 채 칸 위 관찰 → 칸 바닥 태그 측정 → STORE) 측정의 카메라 치우침 [x, y] mm = 적재함이 제자리일 때 로그의
    #   "LOOK_RACK 로 잰 칸 … 칸 표 대비 (dx, dy)" 를 몇 칸 평균. 0 이면 잰 값 − 칸 표를 그대로 적재함 움직임으로 봄
    look_rack_bias_mm: [0.0, 0.0]
    pick_end_at_staging: false       # PICK 뒤 박스 위 기준점 (y +38 mm) 안 감 — STORE 는 집은 자리에서 칸 경로 실제 시작점으로 바로 (11-06 사용자)
    place_far_regrasp: true          # 먼 자리 PLACE: 가까운 빈 자리에 내려놓고 손을 기울여 다시 쥔 뒤 놓기
    # 세우기 경로 전체를 위아래로 [mm]: 실물이 명령보다 약 10 mm 얕게 쥠 → −10 이면 시뮬 (윗면 아래 20 mm 쥐기) 과 같아짐
    #   더 내리지 말 것 (11-05 실물 −25: 경로 전체가 시뮬보다 15 mm 낮아 손가락이 박스를 긁음)
    standup_dz_mm: -10.0
    standup_reach_scale: 1.0    # 쥔 뒤 경로의 수평 이동 배율 (1 = 표 그대로). v11 표는 박스 안 (손끝 x ≤ 0.355) 이라 줄이지 않음 (v10 은 0.43 까지 뻗음)
    standup_tip_clear_mm: 2.0   # 표 점 중 손끝이 박스 윗면 + 이 값 (모델) 아래를 가리키면 그 높이까지 올림 (v10 표는 윗면 아래 10 mm 까지 가리킴)
    # 세우기 경로는 표 녹화 간격 (0.1 s) 그대로 재생 — 시뮬 재생: 녹화 속도 84 % · 15 °/s 로 늦추면 47 % (11-06). 1.5 = 1.5 배 느리게
    standup_time_scale: 1.0       # (강화학습 표만: 녹화 속도를 바꾸면 깨져서 2.5 배에서 뺌)
    standup_open_time_s: 0.5   # 여는 점에서 팔을 멈추지 않고 그리퍼만 이 시간에 다 엶 (여는 점에서 1.2 s 멈추면 시뮬 48 %)
    standup_speed_dps: 15.0    # (세우기 경로 점에는 안 씀 — 위 시간 간격이 정함)
    # 표 칸과 실제 퍽 차이 한도. 경로 전체를 실제 퍽으로 옮기므로 (11-05) 사실상 풂 — 6 mm 일 때 표가 빈 자리 (0.258, −0.008) 를 13 mm 차로 거절
    standup_max_gap_mm: 50.0
    standup_max_gap_deg: 45.0
    # 세운 뒤 바로 다시 쥠 (true) · LOOK 자세에서 끝내고 다음 pick det 로 카메라로 다시 재서 집음 (false, 기본 — 선 자리가 시뮬에서 90 % 12 mm 안)
    standup_regrasp: false
    # 쥐기 뒤 확인 (세우기 경로 전): 손끝이 쥐는 자리에서 이보다 멀거나 · 그리퍼가 이보다 닫히면 멈춤
    standup_reach_tol_mm: 15.0   # 11-05 사용자: 허용치 다 올림 (손가락이 퍽 위에 얹히면 약 17 mm)
    standup_grip_min_m: -1.0     # 끔 (빈손이어도 멈추지 않음). 켜려면 0.001

    # 고정 자세표
    #   - 팔을 수평으로 쭉 뻗지 않는다 (손목 모터 82 g + 판 + 그리퍼 44 mm 전진 → 어깨 부담 ↑)
    #     → 전부 "팔을 굽혀 위에서 내려 잡는" 모양
    #   - 손목 비틀기(joint5)는 ±90° 안 (케이블 꼬임). 원기둥은 0, 직육면체는 ±45° 면 충분
    # 아래 값: 팔 받침 = 맨 위 판(바닥에서 16.4 cm), 앞쪽 x = +0.085 를 가정하고 손끝이 바로 아래를 보도록 계산
    #   목표: 손끝이 몸 중심 앞 0.25 m (몸 앞 끝에서 약 11 cm), 선반 8 cm + 퍽 6 cm 기준
    #         위 = 바닥에서 20 cm, 집기 = 11 cm (퍽 윗부분을 쥠), 놓기 = 11.5 cm
    # ⚠ 실물 선반 거리 · 팔 받침 위치가 정해지면 다시 잡을 것
    #    (팔을 손으로 원하는 자세에 두고 /joint_states 를 읽어 적는 게 가장 빠름)
    poses:
      home:        [-0.0061, -1.4511, 0.9511, -0.1181, 0.0230]   # 그리퍼 받침 위 접은 자세 (틱 4084 · 1102 · 2668 · 1971 · 2063, hardware_map initial 과 같음)
      pick_above:  [0.0,     0.7977, -1.3806,  0.5139, -0.0445]  # 박스 앞 퍽 (0.235, 0) 윗면 위 40 mm, 손 수직 · 처짐 앞먹임 포함 엔코더 목표
      pick_down:   [0.0,     0.6673, -0.5538, -0.1841, -0.0445]  # 같은 퍽 윗면 아래 30 mm (실제 약 25 mm 쥠) — 옛 고정 자세, ArmTask PICK 은 pick_heights_mm (−40) IK 를 씀
      place_above: [-0.9465, -0.2638, -0.3191,  0.5553,  0.5630]  # 적재함 S9 칸 (옛 A) 위 (퍽 바닥이 컵 위 약 8 mm) — 칸마다 다름, 실제 적재는 arm_tests/rack_load 계획
      place_down:  [-0.9465, -0.3513,  0.0169,  0.3037,  0.5630]  # A 칸 안 놓는 자리 (퍽 바닥이 칸 바닥 위 10 mm)

    # =========================== 차례 (한 번에 한 무리, D15) ===========================
    start_locked: true             # 켤 때 바퀴 잠금 (팔 자세를 모름). 첫 HOME 작업이 끝나야 DRIVE
                                   #   planning 없이 몸만 시험할 땐: ros2 action send_goal /arm_task interfaces/action/ArmTask "{task: 0}"
    turn_publish_hz: 10.0          # 차례를 계속 보내는 주기 (swerve_controller 는 0.5 s 안 오면 잠금)
    settle_s: 0.5                  # 팔 작업이 오면 바퀴를 세우고, 몸통이 이만큼 계속 멈춰 있어야 팔 시작 [s]
                                   #   (센 시간은 swerve_controller 의 "잠갔음" 답을 받은 뒤부터)
    still_linear: 0.01             # [m/s] /odom 이 이보다 느리면 "멈춤"
    still_angular: 0.05            # [rad/s]
    odom_timeout_s: 0.5            # /odom 의 측정 시각이 이만큼 오래되면 "멈췄는지 모름" → 팔 시작 안 함

# 손목 카메라 홈 사진 보정 (manipulation camera_drift_node) — 팔이 홈에 멈출 때마다 기준 사진 (config/camera_home_ref.png, 11-04 저녁 잘 될 때)
#   과 비교해 카메라가 손목에서 돈 만큼 /wrist_cam/drift → control_master 가 손목 검출을 되돌림 (wrist_cam_drift_correct)
#   새 기준: 집기 · 적재가 잘 되는 상태에서 홈에 두고 ros2 service call /camera_drift_node/save_reference std_srvs/srv/Trigger
camera_drift_node:
  ros__parameters:
    home_q: [-0.0046, -1.4511, 0.9434, -0.1166, 0.0215]   # 홈 자세 실측 (11-04 · 11-05 같음)
    home_tol_rad: 0.01
    max_deg: 8.0        # 이보다 크게 돌았으면 보정 안 하고 경고 (경첩 · 나사 확인)
    max_resid_px: 8.0
