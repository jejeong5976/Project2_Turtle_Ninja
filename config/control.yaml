# control.yaml — control_master 설정표 (팔 · 차례)
# 바퀴 설정은 config/controllers.yaml 의 swerve_controller 에 (바퀴 계산이 ros2_control 컨트롤러 안이라서, D8).

control_master:
  ros__parameters:
    rate_hz: 50.0                  # 차례 · 팔 진행 확인 주기

    # =========================== 팔 ===========================
    # 관절: joint1(몸통 회전) joint2(어깨) joint3(팔꿈치) joint4(손목 굽힘) joint5(손목 비틀기). 단위 rad
    # 그리퍼: gripper_left_joint, 단위 m (손가락 이동 거리, OpenManipulator-X 와 같음)
    arm_joints: [joint1, joint2, joint3, joint4, joint5]
    gripper_joint: gripper_left_joint
    move_time_s: 4.0               # 동작 하나에 걸리는 시간 (느리게 = 전류 작음, D16)
    accept_timeout_s: 2.0          # 재생기(JTC)가 동작을 받아 주기까지 기다리는 최대 시간
    motion_margin_s: 3.0           # move_time_s 보다 이만큼 더 걸리면 시간 초과 → 취소 + 실패
    # 속도 [°/s] · 가속 [°/s²] (작업마다 다시 읽음, 실행 중 ros2 param set 은 다음 작업부터)
    #   실물은 2.5 배 빠르게 → 25 · 25 · 25 · 60 · 150 을 2.5 배. 시뮬 (받침 세우기, 이 속도) 8 중 8
    #   ⚠ 가속을 올리면 모터 전류가 큼 (J4 과부하 주의) — 실물 첫 시험은 지켜보며. 되돌리기: 25 · 25 · 25 · 60 · 150
    near_puck_speed_dps: 30.0      # PICK · PLACE 의 퍽 위 내림 · 쥐기 · 다시 쥐기
    path_slow_min_dps: 62.5        # 실물 경로 (arm_paths.yaml) 칸 근처 느린 구간 (기록 15) 의 최소 속도. 0 = 기록 그대로
    # 경로별 속도 비율 "경로 이름=비율". 적재함 뒤쪽 칸 (S1 · S2 · S3 · S8) 으로 갈 때 차체가 흔들림 → 10 % 느리게 (넣기 · 빼기)
    #   S1 · S2 는 70 %
    #   새 칸 경로 (storeheld_paths, 변형 이름 전부) 도 같은 칸 같은 값
    path_speed_scale: ["store_S1=0.7", "store_S2=0.7", "store_S3=0.9", "store_S8=0.9", "retrieve_S1=0.7", "retrieve_S2=0.7", "retrieve_S3=0.9", "retrieve_S8=0.9",
                       "store_S1_d50=0.7", "store_S1_d30=0.7", "store_S1_d30_low=0.7", "store_S1_d40_tilt10=0.7", "store_S1_d40_tilt20=0.7", "store_S1_d40_tilt30=0.7", "retrieve_S1_full=0.7",
                       "store_S2_d50=0.7", "store_S2_d30=0.7", "store_S2_d30_low=0.7", "store_S2_d40_tilt10=0.7", "store_S2_d40_tilt20=0.7", "store_S2_d40_tilt30=0.7", "retrieve_S2_full=0.7",
                       "store_S3_d50=0.9", "store_S3_d30=0.9", "store_S3_d30_low=0.9", "store_S3_d40_tilt10=0.9", "store_S3_d40_tilt20=0.9", "store_S3_d40_tilt30=0.9", "retrieve_S3_full=0.9",
                       "store_S8_d50=0.9", "store_S8_d30=0.9", "store_S8_d30_low=0.9", "store_S8_d40_tilt10=0.9", "store_S8_d40_tilt20=0.9", "store_S8_d40_tilt30=0.9", "retrieve_S8_full=0.9"]
    path_stand_speed_dps: 62.5     # 받침 근처 (접기 · 펴기) 구간
    path_speed_dps: 112.0          # 빈 공간 최고 속도
    path_accel_dps2: 280.0         # 가속 · 감속 (짧은 구간도 실제로 빨라지게 속도와 같이 올림)
    # 미션 시간 줄이기: 빈손 그리퍼 동작은 팔을 멈추지 않고 (PICK 퍽 위로 가며 열기 · STORE 놓은 뒤 받침 쪽 가며 닫기),
    #   퍽을 쥐거나 놓을 때만 그리퍼를 기다림 (gripper_time_s 1.2 → 0.7)
    gripper_on_the_way: true
    #   가짜 로봇 STORE S7 (칸 근처 · 받침): 25.1 s (15 · 20) → 21.8 s (25 · 20) · 20.2 s (25 · 30)
    cancel_timeout_s: 2.0          # 취소를 보내고 재생기가 "멈췄다" 고 답하기를 기다리는 최대 시간 (취소 요청 ≠ 실제 정지)
    # ---- 접힘 실측 확인 — 바퀴를 푸는 조건 ----
    #   마지막 home 동작 뒤, 측정 시각이 새로운 /joint_states 의 joint1~5 가 poses.home ± fold_tolerance 안에
    #   fold_hold_s 동안 머물러야 DRIVE. verify_timeout_s 안에 안 되면 팔 작업 실패 → STOP
    #   ⚠ 값은 잠정 — 실물 HOME 의 처짐 · 분해능을 재고 정할 것 (너무 작으면 정상인데도 실패, 너무 크면 덜 접혀도 통과)
    verify_timeout_s: 2.0
    fold_tolerance: [0.05]         # [rad] 하나만 주면 모든 관절 같은 값. 관절마다 다르게: [j1, j2, j3, j4, j5]
    fold_hold_s: 0.3               # [s]
    fold_max_age_s: 0.2            # [s] 이보다 오래된 측정으로는 확인 안 함
    # 하드웨어 이상 → STOP + HOME 확인 무효 (arm.cpp HardwareWatch)
    #   팔 관절 측정이 hw_state_timeout_s 넘게 안 오거나, NaN(못 읽음)이 hw_bad_hold_s 넘게 이어지면
    #   ⚠ 잠정값 — 너무 작으면 측정 한두 번 빠질 때마다 HOME 을 다시 해야 하고, 너무 크면 고장 뒤 잠금이 늦어짐
    hw_state_timeout_s: 1.0        # [s] joint_state_broadcaster 는 100 Hz. 11-10: 젯슨 부하로 0.3 s 끊김이 자주 → 스캔 · 작업이 중간에 섬 → 1 s
    hw_bad_hold_s: 0.1             # [s] 하드웨어는 0.05 s 넘게 못 읽은 모터를 NaN 으로 냄 (measure_max_age_s)
    # 보드 2장: 보드 상태를 controller_manager 에 직접 물음 — 하나라도 active 가 아니면 STOP
    hw_component_hz: 5.0           # [Hz] 묻는 빈도 (응답 대기 중인 요청은 하나만)
    hw_component_timeout_s: 4.0    # [s] 이만큼 답이 없으면 "모름" = 이상 (0 이하 = 보드 상태 안 봄)
    # 측정을 볼 관절. 기본 = 주행 8 + 팔 6 전부. 책상 시험에서 모터 일부만 쓰면 그 관절만 남길 것
    hw_watch_joints: [drive_fl_joint, drive_fr_joint, drive_rl_joint, drive_rr_joint,
                      steer_fl_joint, steer_fr_joint, steer_rl_joint, steer_rr_joint,
                      joint1, joint2, joint3, joint4, joint5, gripper_left_joint]
    gripper_time_s: 0.7            # 그리퍼 한 동작 시간 [s] (기본 1.2, 미션 시간 줄이기). 쥐기가 덜 되면 1.0 으로
    grip_settle_s: 0.3             # 그리퍼를 여닫기 전 같은 자세로 기다림 (그리퍼 동작 때 관절이 아직 2° 남아 받침 넣기 · 칸 놓기가 반반)
    # 손이 흔들리며 도착해 그대로 박으면 퍽 위에서 이만큼 멈춤 (예 0.3~0.5). 실행 중: ros2 param set /control_master pick_settle_s 0.4
    pick_settle_s: 0.3             # PICK 퍽 위 (내려가기 직전) · 다시 쥐기 위. 0 = 지금 동작 그대로
    place_settle_s: 0.3            # PLACE 놓을 자리 위도 같게
    # 칸 위에서 멈췄다 넣기 (예 0.4). 켜면 칸 보정을 다시 맞춰야 함 (멈춤 없이 맞춘 값). 실행 중: ros2 param set /control_master store_settle_s 0.4
    store_settle_s: 0.0            # STORE 칸 위 (놓는 점 위 store_settle_up_mm 이상 높은 마지막 점 = 마지막 내려가기 직전). 0 = 지금 동작 그대로
    store_settle_up_mm: 20.0       # 칸 위 점을 고르는 높이 [mm, 놓는 점 손끝 기준] (기록 경로: 12 칸 모두 놓기 9~15 점 앞, 놓는 점과 수평 1–4 mm)
    gripper_open: 0.0164           # [m] 실측 기준: 닫힘(약 3478 틱) + 1000 틱 = 간격 약 50 mm (scale 0.01149 · zero 3549)
    gripper_close: -0.0016         # [m] 실측 기준: 닫힘 − 20 틱 (퍽이 있으면 전류 한계로 그 전에 멈춤 = 쥠)
    # 나중에 접기: STORE · PLACE 를 P0 (받침 바로 위) 에서 끝냄 → 다음 팔 작업이 접기 · 펼치기 (약 10 s) 를 건너뜀. 주행 전 HOME 이 접음
    #   P0 에서 약 15 s 버티면 팔 모터 과열 Hardware Error (실물) → lazy_fold_idle_s 동안 다음 작업이 없으면 스스로 접음
    lazy_fold: true
    lazy_fold_idle_s: 5.0            # planning 이 다음 작업을 보내는 틈 (LOOK 기다림 등) 보다 길게, 과열 (약 15 s) 보다 짧게
    # 쥐는 깊이 [mm, 퍽 윗면 기준 손끝]: 위 · 내림 · 쥐기. 실물에서 명령 −40 이 실제 약 30 mm 만 쥠 (윗면 높이를 약 1 cm 높게 봄) →
    #   적재함 경로 (실제 40 mm 로 쥔 퍽으로 가르침) 와 맞게 명령 −50. 기울인 손은 40 (실제 약 30 = 퍽 무게중심)
    pick_heights_mm: [40.0, 10.0, -50.0]
    pick_tilted_depth_mm: 40.0
    # PICK 목표 퍽 중심 z 가 박스 윗면 + 반높이 (누운 퍽 = 반폭) 에서 이만큼 [mm] 벗어나면 바로 거절 (11-09 B4: 퍽 8 z 0.178 로 10 s 계획). 0 이하 = 안 봄
    pick_z_tol_mm: 30.0
    # 선 퍽 윗면을 이만큼 높게 봄 [mm] → 쥐는 손끝이 얕아짐 (pick_heights_mm · STORE 칸 높이 맞춤은 그대로). 누운 퍽은 안 씀
    #   실물 (J1 영점 · 나사 다시 끼운 뒤): 명령 −50 이 너무 깊게 쥠 → 10 mm (실제 약 40 mm 쥠)
    pick_top_bias_mm: 10.0   # 11-10 12:1x 카메라 받침 URDF 보정 뒤: 20 은 너무 얕음 (카메라 오차 약 15 mm 를 메우던 값) → 10 (실제 40 mm, 적재함 경로 기준). 그 전: 11-10 10:4x 실물: 아직 깊어 손가락 끝 대각선 플라스틱이 퍽을 밀어냄 → 10 mm 더 얕게 (실제 약 30 mm)
    # PICK 쥐는 점 보정 [mm, base_link] — 윗면 태그가 안 보인 퍽만 (태그 보인 퍽은 인지가 태그로 중심 · 면 방향을 잡음)
    #   손목 인지 깊이 평균이 퍽 중심을 앞으로 · 왼쪽으로 밀어 잡음 (태그와 비교 9.6 · 1.7 mm). 실물에서 집어 S12 에 넣기까지 된 값
    #   실행 중 바꾸기: ros2 param set /control_master pick_offset_x_mm <값>
    #   ⚠ 주석 ("−22 로 가니 더 직진 쪽 = 방향 반대였음") 과 주석 ("+x = 앞") 이 서로 반대로 읽힘 → +x 가 실제로 어느 쪽인지 실물에서 +1 mm 로 확인할 것
    pick_offset_x_mm: -0.5                 # 11-10 11:5x 카메라 받침 URDF 보정 (camfix_1150) 뒤 0 — 그 전 +4 는 카메라 오차를 메움. 그 전:  실물: 뒤를 잡음 → −2 → +1 (062d12c) → +4 (d1e2767, 3 mm 더 앞). 임시 — 팔 원인 확정 뒤 −2 로 원복 (base_link +x = 로봇 앞). 실물: 카메라로 본 선 퍽을 직진 쪽으로 1 cm 더 쥠 → -12 에서 +10 (-22 로 가니 더 직진 쪽 = 방향 반대였음)
    pick_offset_y_mm: 0.0   # 11-10 카메라 받침 URDF 보정 뒤 0 (그 전 −3.5)
    # 윗면 태그로 잰 퍽 (인지 중심 2 mm 안) 은 팔 쪽 치우침만 — 실물에서 태그 퍽을 집어 맞춘 값 (몸쪽 17 mm)
    pick_offset_tagged_x_mm: 0.0          # 11-10 카메라 받침 URDF 보정 뒤 0. 그 전 10: 실물: 태그 선 퍽을 뒤에 쥠 → 4 → 10 (S12 넣기 됨). 그 전: −2 → +1 → +4
    # 손목을 90° 돌려 쥘 때 더할 보정 [앞, 왼쪽] mm (팔 바로 앞 퍽 기준, 다른 각도 · 자리는 계산). 실물에서 돌려 쥔 뒤 어긋난 만큼 넣기
    #   실물: −73° 돌려 쥐니 손가락이 2 mm 오른쪽 → [0.4, 2.4] (그 뒤 −38° 쥐기 "완벽"). 실행 중에만 넣어 재시작 때 0 으로 돌아감 → 설정에 넣음
    pick_offset_rot_mm: [0.4, -7.6]   #  실물: 시계 방향 (−90°) 으로 돌려 쥐니 10 mm 더 오른쪽으로 가야 함 → 왼쪽 성분 −10 (카메라 회전을 고친 뒤). 돌린 각 · 자리에 따라 바뀌는 모델 값
    pick_offset_rot_robot_mm: [-2.0, -7.0]   # 손목을 돌려 쥘 때 그대로 더함 [앞, 왼쪽] 로봇 기준. 실물: 돌려 쥐면 로봇 기준 오른쪽 7 · 뒤 2 mm 더
    pick_offset_tagged_y_mm: 0.0   # 11-10 카메라 받침 URDF 보정 뒤 0 (그 전 −3.5)
    pick_offset_tilt_mm: [0.0, 0.0]   # 기울인 손 (먼 퍽) 만 [접선 + 왼쪽, 반지름 + 바깥] mm. 11-09 실물: 먼 퍽에 오른쪽 손가락이 닿음 → 오른쪽 3 mm → J1 22 때 왼쪽 치우침이었음, J1 8 로 되돌린 뒤 원기둥이 오른쪽으로 치우쳐 0 (11-09 22:2x)
    lying_z_fix_mm: 15.0   # 누운 퍽 검출 z 가 박스 윗면 기준에서 이보다 어긋날 때만 박스 기준 높이로 (11-09: 빨강 30.5 vs 54). 안이면 검출 그대로 (받침 세우기 값 유지)
    # 누운 퍽 위 옆면 태그로 잰 중심 (perception tag_lying_refine): 실물 PICK 으로 x 를 맞춤 (y 는 아직 0)
    #   받침 세우기는 긴축 방향 ±2 mm 안이 필요 (시뮬). 태그 안 보인 누운 퍽은 pick_offset_x/y (깊이 점 중심)
    pick_offset_lying_tagged_x_mm: 0.0   # 11-10 카메라 보정 뒤 0 (그 전 −5):   #  실물, 카메라 회전을 고친 뒤 (f8adc21): 0 이면 조금 앞에서 쥠, -5 로 세우기 됨 (고치기 전 -25 는 카메라 오차를 메운 값).: 5 mm 더 몸 쪽 · 실물: 오늘 바꾼 값들로는 한 번도 안 서서 (92b9e1a) 값으로 되돌림 → 성공
    pick_offset_lying_tagged_y_mm: 0.0   # 11-10 카메라 보정 뒤 0 (그 전 −5):   #  실물: 누운 퍽이 오른쪽을 긁어 날림 → 오른쪽 5 mm (param set 으로 성공, 재시작 때 사라져 저장). 임시 — 팔 원인 확정 뒤 0.0 으로 원복
    # 태그가 안 보인 누운 퍽 (깊이 점 중심) — 전까지는 선 퍽 pick_offset_x/y 를 같이 씀 → 같은 값으로 시작, 실물로 맞출 것
    pick_offset_lying_x_mm: -6.0            # 실물: 태그가 긁혀 안 읽히는 누운 퍽을 −12 면 가운데 쥐어 받침 앞에 떨굼 → 0 에서 끝 쪽을 쥐고 섬
    pick_offset_lying_y_mm: 0.0   # 11-10 15:1x 카메라 받침 URDF 보정 뒤: −13.5 면 누운 네모 퍽 테두리를 긁음 → 0. 그 전 −13.5:          #  실물: 태그 보인 쪽과 같이 오른쪽 5 mm (param set 으로 성공, 재시작 때 사라져 저장). 임시 — 팔 원인 확정 뒤 -3.5 로 원복 → 11-09 22:30 태그 끈 (모양 중심) 누운 퍽: 오른쪽 손가락이 퍽을 쳐 5 mm 더 오른쪽 → 받침까지 넣음
    # STORE 칸 근처 경로 보정 [mm, base_link, x+ = 앞 · y+ = 왼쪽, 15 까지] — 쥔 퍽이 칸에서 늘 한쪽으로 걸리면. 실행 중 ros2 param set 으로 바꿈
    # 수직 손이 안 닿는 먼 퍽: 손을 10° 씩 이만큼까지 바깥으로 기울여 쥠 (박스 끝 모서리 0.32 m 는 40°). 기울여 쥔 퍽은 다시 잡기로 세움
    pick_max_tilt_deg: 40.0
    # 다시 잡을 자리 탐색 시간 예산 [s] (11-09 실물: 19 곳 IK 로 10 s 계획 → motion_mode 끊겨 미션 FAULT). 넘으면 그 퍽 거절 = 미션이 건너뜀. 0 이하 = 예산 없음
    regrasp_search_s: 4.0
    # 내려놓을 자리 (다시 쥐기 · 먼 자리 PLACE) |y| 상한 [m] = 박스 반폭 0.1025 − 퍽 반폭 0.0174 − 여유 0.01 (11-09: 좌우 ±8 cm 후보가 박스 밖)
    regrasp_max_abs_y: 0.075
    store_offset_x_mm: 0.0
    store_offset_y_mm: 0.0
    # PLACE 놓는 점 보정 [mm, base_link, x+ = 앞 · y+ = 왼쪽] — 모든 PLACE 목표에 더함 (먼 자리 다시 쥐기의 마지막 놓기도). 장소별 차이는 planning.yaml place_offset_L*_mm
    #   실물에서 맞추기: 놓인 퍽이 눈 점보다 로봇 쪽으로 5 mm 면 x +5. 실행 중: ros2 param set /control_master place_offset_x_mm 5.0 (다음 PLACE 부터)
    place_offset_x_mm: -15.0
    place_offset_y_mm: -10.0
    # 칸마다 더하는 STORE 보정 [x, y] 또는 [x, y, 높이] mm (없는 칸 = 0, 높이 − = 더 내려 놓기). 실행 중: ros2 param set /control_master store_offset.S7 "[0.0, 5.0]"
    store_offset:
      # 새 적재함 · 카메라 회전을 고친 뒤 실물: 오른쪽 4 칸 (S4 · S7 · S9 · S12) 은 로봇 앞으로 놓임 (스캔으로 잰 칸은 칸 표와 x 3.4 mm 안 → 팔 쪽 차이)
      #   S12 는 칸 근처 합계 (-10, +2.5) mm 에서 들어감 (그때 접근축 1° 한도로 -20 의 50 % 만 옮겨짐). 나머지는 x 를 -10 mm 로 시작해 실물로 맞출 것
      S12: [3.0, 1.0, -10.0]  # 11-10 11:3x 실물: 바르게 쥔 퍽은 [−4, −2, −10] 못 들어감 · 손 뒤로 8.7 mm 쥔 퍽 (퍽이 손 안에서 앞) 은 들어가고 오른쪽 3 → 앞 9 · 왼쪽 3. 그 전: [−7, −2] 뒤로 감. 그 전 실물: [−10.6, −4.3] 은 뒤 · 왼쪽 (S2 쪽) 모서리에 2 mm 걸림 (세운 퍽) → [−5, −2] 로 들어감 → 11-10 09:4x 실물: 뒤로 2 mm 더
      S9: [0.7, -2.0]     #  실물, 선 퍽 (pick det) 성공: 칸 근처 합계 (-6.7, +8.0). 세운 퍽으로는 (-11.7, +3.0) 에서 들어갔음
      S4: [2.0, -10.0]    #  실물 선 퍽으로 맞춤 (오른쪽 앞 대각선), 다시 4 mm 앞 · 3 mm 오른쪽
      S7: [-8.0, 1.5, -10.0]  # 11-10 15:1x 실물: 뒤 · 왼쪽 (S1 · S2 쪽) 으로 4 mm 넘침 → 반대로 (+2.2, −3.4). 그 전 [−10, 5, −10]:  실물 선 퍽 성공 [-10, 0] → 오후: 오른쪽으로 치우침 → S12 쪽 (왼쪽) 5 mm · 10 mm 더 깊게
      # 왼쪽 8 칸: 실물 선 퍽으로 S1 · S2 가 왼쪽 4 · 앞 3 mm → 왼쪽 조각 모두 (-3, -4) 더함
      S10: [7.0, 10.0, -5.0]  #  실물에서 맞춤, 뒤로 3 mm · 5 mm 더 깊게 넣기
      S5: [4.0, 10.0, -7.0]    #  실물: 왼쪽 앞 대각선으로 맞춤
      S1: [-3.0, -1.0, -15.0]  #  실물: 왼쪽으로 3 mm 더 · 놓는 자리가 높아 (선 퍽 바닥이 테두리 위 25 mm) 15 mm 더 내려 놓기 (세 번째 = 높이 mm, − = 아래)
      S2: [-3.0, 2.0, -15.0]   # S1 과 같이 (선 퍽 바닥이 테두리 위 20 mm → 5 mm). 손가락은 앞뒤로 닫혀 옆 칸 (S1) 퍽과 안 닿음 ·: S1 쪽 (왼쪽) 3 mm 더 (세운 퍽으로 봄)
      S3: [-6.0, 10.0, -7.0]  #  실물에서 맞춤 · 오후: 7 mm 더 내려 놓기 · 좌우는 실물 값 13
      S6: [6.0, 10.0, -5.0]  #  실물 [6, -25] → 오후: 오른쪽 옆 칸 (S11) 에 떨어짐 → 왼쪽으로 25 mm, 다시 10 mm 더 · 너무 위에서 떨궈 5 mm 낮춤
      S8: [-10.0, 15.0]   #  실물: [-3, -4] 면 오른쪽 앞 대각선으로 감 → 왼쪽 뒤 (S1 쪽) 로 맞춤
      S11: [7.0, 12.0]    #  실물에서 맞춤
    # 칸마다 RETRIEVE (빼기) 보정 [x, y] 또는 [x, y, 높이] mm — STORE 보정은 빼기에 안 들어감. 실행 중: ros2 param set /control_master retrieve_offset.S12 "[-10.0, -5.0]"
    #   높이 (− = 더 깊게 쥠) 만큼 꺼낸 퍽의 쥔 깊이 (retrieve_grip_depth_mm 25) 도 달라져 PLACE 놓는 높이에 반영됨
    # 세운 퍽 새 칸 경로 (store_<칸>_d30 · _d40_tilt* 등, storeheld_paths) 칸마다 [x, y] 또는 [x, y, 높이] mm — store_offset 은 이 경로에 안 들어감
    storeheld_offset:
      S7: [5.0, 0.0]   # 11-10 15:3x 실물: 세운 초록 네모 store_S7_d30 이 뒤로 → 직진 쪽 3 mm → 2 mm 더
      S1: [-0.5, 1.5, -10.0]
      S2: [-0.5, 1.0, -10.0]
      S3: [0.0, -2.5, -10.0]
      S4: [4.5, 8.5, 0.0]
      S5: [-4.5, -6.5, -13.0]
      S6: [2.5, 1.5, -10.0]
      S8: [0.5, 1.0, -10.0]
      S9: [4.5, 4.5, 0.0]
      S10: [4.0, 0.5, -10.0]
      S11: [2.0, 1.0, -10.0]
    retrieve_lift_clear_mm: 32.0   # RETRIEVE: 쥔 뒤 칸 안에서 곧게 이만큼 올리고 나감 (퍽 바닥이 칸 테두리 28 mm 위로). 11-10 실물: 깊게 쥔 R12 를 꺼낼 때 칸을 긁음. 0 = 끔 (기록 경로 그대로)
    store_lift_clear_mm: 30.0   # STORE 놓은 뒤 칸 안에서 곧게 올림 (0 = 끔)
    retrieve_offset:
      S12: [0.0, 4.0, -17.0]   # 11-10 14:4x 실물: 정면 쪽 그리퍼가 걸림 → 정면으로 2 mm. 14:2x: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전: 실물: [−8, −5] 는 위를 쥐고 뒤 → 10 mm 깊게 · 직진 6 · 왼쪽 7 mm (칸 위 멈춤 켜고 [−5, 2] 로 넣은 퍽에서 맞춤) → 11-10 09:4x 실물: 빨강 원기둥 왼쪽 2 mm 더
      S7: [-10.0, 10.0, -17.0]  # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 박스 반대쪽 4 mm (−15 · −25 는 너무 멀리) · 왼쪽 3 mm · 1 cm 더 깊게 → 11-09: STORE S7 을 왼쪽 5 mm 로 바꾼 만큼 (놓는 점 y −118.1 · 잡는 점 −125.1) 왼쪽 5 → 8 → 잡는 점이 앞 14.6 · 오른쪽 2 mm (계산, 실물: 앞 · 오른쪽으로 감) → 뒤 6 (11-07 −15 는 너무 뒤) · 왼쪽 2
      S3: [0.0, 0.0, -14.0]    # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 7 mm 더 깊게 쥐기
      S6: [0.0, 0.0, -12.0]    # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 5 mm 더 깊게 쥐기
      S9: [-3.0, 2.0, -10.0]    # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 직진 (박스) 쪽 2 mm · 3 mm 더 깊게
      S10: [0.0, 0.0, -17.0]  # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 자리 맞음 · 10 mm 더 깊게 쥐기
      S11: [6.0, 3.0, -12.0]   # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 직진 (박스) 쪽 4 · 왼쪽 3 · 5 mm 더 깊게 쥐기
      S8: [4.0, 7.0, -17.0]   # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 왼쪽 3 cm → 오후: 오른쪽으로 23 mm 되돌림 · 직진 (박스) 쪽 4 mm · 10 mm 더 깊게
      S4: [-7.0, 2.0, -7.0]    # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 오른쪽으로 8 mm · 뒤로 4 mm 더, 다시 뒤 (프로파일 쪽) 3 mm
      S1: [0.0, 0.0, -20.0]   # 실물: −20 은 칸 근처를 너무 낮게 지남, −10 은 위를 쥠 → −15 로 잘 잡음
      S2: [3.0, 0.0, -15.0]   #  실물: S1 처럼 위를 쥠 → 1 cm 더 내려가 쥐기 (먼 칸일수록 기록이 높음: 나사 조인 뒤 팔이 덜 처짐)
      S5: [0.0, 0.0, -12.0]    # 11-10 14:2x 실물: 빼기는 위만 살짝 쥠 → 7 mm 더 깊게 (모델: 손끝이 칸 테두리 위 7 mm 이상). 그 전:  실물: 더 깊게 쥐어도 됨 → 5 mm
    # 넣는 점 맞추기: 경로의 놓는 점을 팔 모델로 칸 표 (config/rack_cells.yaml 칸 중심 + place_offset) 로 옮김 (칸마다 자동, 위 보정은 그 위에 더함)
    store_to_cell: true
    store_match_grip_depth: true   # 쥔 깊이가 박스 PICK (pick_heights_mm 마지막 50) 과 다르면 칸 근처 높이를 그 차만큼 (받침에서 30 mm 로 다시 쥔 퍽 → +20 mm). 실물: 세운 퍽이 S2 에 긁힘
    # 새 칸 경로 (11-10, arm_paths.yaml store_<칸>_d50 · _d30 · _d30_low · _d40_tilt10 · 20 · 30 · retrieve_<칸>_full — 칸 보정이 이미 들어 있어 위 store_to_cell · store_offset ·
    #   store_match_grip_depth · retrieve_offset 은 안 탐, 적재함 스캔 이동만). false = 지금 이름 (store_<칸> · retrieve_<칸>) 그대로. 실행 중: ros2 param set /control_master storeheld_paths false
    storeheld_paths: false
    storeheld_low: false        # 세운 퍽 (30 mm) 을 _d30_low (퍽 바닥 = 테두리 +3 mm, S7 네모는 없음 → _d30) 로
    storeheld_over_look: true   # LOOK_RACK 뒤 관찰 자세여도 store_look_<칸> 대신 새 경로. false = 관찰 자세면 store_look_<칸> 그대로
    # 쥔 퍽 손 안 위치 (손목 카메라, rack_tag_node 를 띄워야 잼): false = STORE 때 로그만, true = 기준과 차이만큼 칸 근처 경로를 옮김
    #   기준: STORE 가 잘 들어간 PICK 뒤 (넣기 전, 기준점에서) ros2 service call /control_master/save_held_reference std_srvs/srv/Trigger
    held_correct: true
    place_held_correct: false   # 같은 보정을 PLACE 바로 놓기에도 (다시 쥐는 먼 자리는 안 함). 켜기: ros2 param set /control_master place_held_correct true
    # 손목 카메라가 손목에서 돈 만큼 손목 검출을 되돌림 (camera_drift_node 의 /wrist_cam/drift, 아래 camera_drift_node 설명)
    wrist_cam_drift_correct: true
    # 누운 네모 퍽 PICK 때 세움 (경로 표 config/standup_paths.txt, Isaac 강화학습 → 피드백 없이 재생). false = 누운 채 PICK
    #   실물 첫 시험: ros2 param set /control_master stand_lying true → 누운 네모 퍽 pick det
    # 누운 퍽 쥐기 [mm, 누운 윗면 기준]: 위 · 내림 · 쥐기. 실물은 명령보다 약 10 mm 얕게 쥠 (−20 은 끝만 걸침, −30 도 얕음) → −45
    pick_lying_heights_mm: [40.0, 10.0, -45.0]
    pick_lying_tip_clear_mm: -15.0   # 쥐기 깊이 한도: 손끝이 놓인 면 아래 15 mm (모델) = 실제 약 −5 mm (실물 −45 로 쥠 확인)
    stand_lying: true    #  기본 켬
    # 세우는 방법: park = 그리퍼 받침에 기울여 넣고 손가락으로 밀어 세운 뒤 다시 쥠 (시뮬 깊이 35 · 2.5 배 속도 8 중 8),
    #   table = 강화학습 표 재생 (박스 위, 시뮬 재생 77 ~ 84 %)
    stand_lying_mode: park
    park_center: [0.1008, 0.00115]   # 그리퍼 받침 중심 [m, base_link] (URDF).: 0.0958 로 옮겼더니 밀기 · 다시 쥐기까지 뒤로 가 세운 퍽을 침 → 되돌림 (넣는 자리만 park_end_inset_mm 로)
    park_floor_z: 0.1365             # 받침 바닥 윗면 [m, base_link]
    park_tilt_deg: 45.0              # 넣을 때 손 기울임 (안 되면 5° 씩 40 까지). 받침 위에서 가까운 퍽은 50° 까지, 기울여 쥔 먼 퍽은 40° 까지 IK
    park_grasp_offset_mm: 30.0       # 누운 퍽을 중심에서 끝 쪽으로 옮겨 쥠. 실물: 손가락 면 반쯤만 퍽 앞 끝에 걸쳐야 세워짐 → 25 에서 30, 다시 1 cm 더 (40) · 실물: 오늘 바꾼 값들로는 한 번도 안 서서 (92b9e1a) 값으로 되돌림 → 성공 · 실물: 쥐고 넣을 때 손이 너무 앞 → 7 mm 줄임 (18) ·: 18 에서 세우기가 달라져 25 로 되돌림
    park_insert_clear_mm: 4.0        # 놓을 때 퍽 가장 낮은 모서리 ↔ 받침 바닥 (실물: 2 면 넣다 걸려 밀려 나옴, 20 이면 떨어지며 뒤로 넘어감)
    park_end_inset_mm: -3.0          # 아래 끝면 중심 = 받침 중심에서 J1 쪽으로 이만큼 (음수 = 바깥). 실물 (받침 넓힌 뒤): 4 면 팔 쪽 벽에 걸려 -3,: 들어갔다 안 들어갔다 해서 2 mm 더 앞 (-5), 오후: 넣는 자리가 앞 → 5 mm 뒤 (0) · 실물: 오늘 바꾼 값들로는 한 번도 안 서서 (92b9e1a) 값으로 되돌림 → 성공
    park_push_h_mm: 25.0             # 미는 손끝 높이 (받침 바닥 위)
    park_push_extra_mm: 9.0          # 밀어 세우기 끝점을 몸 (J1) 쪽으로 더 (실물: 밀기가 짧아 퍽이 받침 앞 턱에 살짝 걸쳐 미끄러짐 → 4 mm). 0 = 선 퍽 바깥 면 + 4 mm 앞에서 멈춤 ·: 4 면 선 퍽 면에 닿기만 하고 안 밂 → 9
    park_push_scoop_deg: 25.0        # 굴삭기처럼 밀기: 손끝을 몸 (J1) 쪽으로 이만큼 기울여 시작, 밀면서 손을 세움. 실물: 15 → 25 좋음. 0 = 끔
    park_push_low_mm: 0.0            # 굴삭기 밀기 시작 높이를 park_push_h_mm 보다 이만큼 낮게
    park_push_j3_deg: 0.0            # 밀어 세우는 동안 J3 를 이만큼 더 [°, + = 손끝 위 / − = 손끝 아래], 밀기 가운데서 전부, 시작 · 끝점 0 (끝에서 펴야 그리퍼가 받침에 안 닿음). 로봇 오른쪽에서 보면 − = 시계 방향
    park_push_j2_deg: 0.0            # 밀어 세우는 동안 J2 를 이만큼 더 올림 [°, + = 손끝 위], J3 와 같은 모양 (가운데 전부, 시작 · 끝 0) → 손끝이 퍽 뒷면 아래 모서리를 긁어 올려 세움
    park_press_mode: true            #  집고 넣기 · 놓기 그대로, 옆으로 밀기 대신 놓은 손을 올려 빼고 수직으로 · 닫고 받침 뒤 (J1 쪽) 에 곧게 내려 꽂아 걸린 퍽을 눌러 세움. false = 옆으로 밀기
    park_press_r_mm: -28.0           # 꽂는 손끝 자리 = 받침 중심에서 [mm] (− = 뒤 · J1 쪽, 뒤 벽 안쪽 면 −23.5, 손가락 반두께 6). 실물: −16 · −18 · −20 은 뒷벽에 안 닿음 → −28 에서 세움
    park_press_top_mm: 66.0          # 올려 빼는 · 넘어가는 손끝 높이 = 바닥 위 [mm] (수직 손이 닿는 끝 66, 선 퍽 윗면 60)
    park_press_h_mm: 10.0            # 꽂는 가장 낮은 손끝 높이 = 바닥 위 [mm]
    park_press_speed_dps: 0.0        # 꽂아 내리기 (park_press1–4 · up) 속도 [°/s], 0 = park_speed_dps (실물 그대로). 퍽이 튀면 20 (밀기 속도)
    park_regrasp_depth_mm: 30.0      # 선 퍽 다시 쥐기 깊이 (손끝이 받침 벽 위)
    park_regrasp_r_mm: 0.0           # 선 퍽 다시 쥐는 자리 = 받침 중심에서 반지름 방향 (+ = 로봇 정면, − = J1 쪽). 시뮬 -6, 실물 (받침 넓힌 뒤): 0 = 받침 중심에서 쥐면 맞음 (-10 · -16 은 앞쪽을 쥠, -26 부터는 IK 안 됨).: 1 mm 더 정면, 다시 3 mm 더 (4) · 실물: 오늘 바꾼 값들로는 한 번도 안 서서 (92b9e1a) 값으로 되돌림 → 성공
    park_insert_j3_deg: 0.0          # 넣는 자세 (기울이는 점들) 의 J3 를 이만큼 더 [°, + = 손끝 위]. 5° = 넣는 점에서 위 22 · 바깥 9 mm · 손 5° 덜 기욺
    park_step: false                 # 구분 동작: true 면 세우기를 동작마다 멈춤 → 다음: ros2 service call /control_master/step std_srvs/srv/Trigger
    # 받침에 넣을 때 손가락을 살짝 풀어 퍽이 손가락 사이에서 돌며 들어가게 (박스 세우기 때처럼). 기울이는 8 점 중 park_loose_step 번째부터
    #   손가락 위치 [m]: 퍽에 닿음 약 0.0046 (쥔 채 실측) · 놓기 0.0093 · 다 엶 0.0164. 0.0060 = 양쪽 합 약 3 mm 틈
    park_loose_step: -1              # 다 기울인 점 (곧게 넣기 시작) 에서 풂 — 곧게 들어가며 퍽이 손가락 사이에서 돎 · 실물: 오늘 바꾼 값들로는 한 번도 안 서서 (92b9e1a) 값으로 되돌림 → 성공
    park_loose_grip_m: 0.005         #: 끌며 놓기 때 0.006 이면 퍽이 떨어짐 → 0.005 (닿는 폭 0.0046)
    # 대각선 자세로 위에서 곧게 넣기 (실물: 퍽이 받침 턱에 2–3 mm 걸침). 다 기울인 자세를 15 mm 위에서 만들고 그대로 곧게 내려 넣고,
    #   끝점을 3 mm 더 아래로 밀어 넣음. 0 · 0 = 기울이며 내려가 끝에서 놓기
    park_insert_back_mm: 0.0         #  실물: 오늘 바꾼 값들로는 한 번도 안 서서 (92b9e1a) 값으로 되돌림 → 성공
    park_insert_extra_mm: 0.0
    park_insert_from_back_mm: 0.0    #  넣기 출발을 이만큼 뒤 (S12 쪽) 에서 → 뒤 위에서 앞 아래로 대각선으로 들어감
    # 당기며 놓기 (그 자리에서 놓지 말고 몸 쪽으로 슬슬 당기며 놓기, 손은 올리지 말고): 넣는 점에서 손가락만 살짝 풀고 (park_loose_grip_m),
    #   같은 높이 · 기울임으로 J1 쪽 (뒤) 으로 이만큼 곧게 당긴 끝에서 놓음 (밀기 속도). 0 = 그 자리에서 놓음
    park_release_pull_mm: 14.0       # 넣는 점에서 같은 높이로 몸 (J1) 쪽으로 이만큼 끌고 놓기. 실물: 그립 0.006 이면 그 자리에 떨굼 → park_loose_grip_m 0.005 로 쥔 채 10 mm (이렇게 가자)
    park_release_pull_dz_mm: 0.0     # 당기는 동안 위아래 (− = 내려가며 밀어 넣기)
    park_release_pull_steps: 3
    park_release_up_mm: 0.0          # 넣는 끝점을 손등 (손목 카메라 달린) 쪽으로 이만큼, 손 축에 수직 — 넣으면서 같이 (놓기 전 손목을 카메라 쪽 위로 5 mm, 나눠서 말고) · 실물: 오늘 바꾼 값들로는 한 번도 안 서서 (92b9e1a) 값으로 되돌림 → 성공
    park_speed_dps: 50.0             # 넣기 · 다시 쥐기 (2.5 배)
    park_push_speed_dps: 20.0        # 밀어 세우기만 천천히 (시뮬: 50 이면 ±2 mm 오차에 12 중 6–8, 20 이면 12 중 12)
    park_max_tilt_deg: 30.0          # 먼 누운 퍽: 쥘 때 손을 10° 씩 이만큼까지 기울임 (접선 방향 퍽은 그만큼 굴러 손가락에 맞음)
    park_roll_margin_mm: 2.5         # 굴려 쥘 때 열린 손가락 ↔ 퍽 최소 여유
    park_max_roll_deg: 12.0          # 굴려 쥐기 최대 (시뮬: 10° 됨, 20° 는 들다 놓침)
    # 먼 · 옆 누운 퍽 옮겨 놓기 (11-09 21:4x: (0.27~0.31, ±0.05~0.08) 은 받침 세우기 계획 거절, 왼쪽 먼 (0.23, 0.09) · (0.25, 0.10) 은 끝 쪽 25 mm 쥐기 놓침,
    #   가운데 가까운 (0.225, −0.050) 은 됨): 가까운 자리 밖이거나 지금 자리에서 계획이 안 되면 퍽 가운데를 누운 채 쥐어 가까운 빈 자리
    #   (regrasp_min_x · regrasp_max_abs_y 안, 시간 예산 regrasp_search_s, 긴축 = J1 반지름 방향) 에 내려놓고 거기서 지금의 받침 세우기 그대로
    #   (한 PICK 안에서, 다시 보기 없이 놓은 자리를 믿음). 가까운 자리의 경로 · 값은 바뀌지 않음. 끄기: ros2 param set /control_master park_relocate false
    park_relocate: true
    park_box_regrip: true           # 세운 퍽을 박스 위에 내려놓고 박스 퍽처럼 50 mm 로 다시 쥠 (+약 6 s). 받침 30 mm 그대로면 칸에 13 mm 낮게 들어감 (J4 범위, 11-09 S4). false = 예전
    park_table_fallback: true        # 받침 · 옮겨 놓기 다 안 되는 먼 누운 퍽 → 강화학습 세우기 표 (팔을 멀리 뻗음). false = 거절
    park_near_max_r_m: 0.24          # 가까운 자리 = J1 (팔 모델 j1_xy) 에서 이 거리 안 [m]. 실물로 된 (0.225, −0.050) 은 안, 안 된 (0.272, −0.055) 부터는 밖이 되게 (약 0.23 ↔ 0.28)
    # LOOK_RACK (퍽 쥔 채 칸 위 관찰 → 칸 바닥 태그 측정 → STORE) 측정의 카메라 치우침 [x, y] mm = 적재함이 제자리일 때 로그의
    #   "LOOK_RACK 로 잰 칸 … 칸 표 대비 (dx, dy)" 를 몇 칸 평균. 0 이면 잰 값 − 칸 표를 그대로 적재함 움직임으로 봄
    look_rack_bias_mm: [0.0, 0.0]
    # LOOK slot left · right: LOOK 자세에서 J1 만 이만큼 돌려 박스 옆 끝 (y ±0.07 넘는 퍽) 을 봄 [°, left = +]. slot "" 이 되돌림
    look_side_deg: 18.0
    look_side_tilt_deg: 6.0
    pick_end_at_staging: false       # PICK 뒤 박스 위 기준점 (y +38 mm) 안 감 — STORE 는 집은 자리에서 칸 경로 실제 시작점으로 바로
    place_far_regrasp: true          # 먼 자리 PLACE: 가까운 빈 자리에 내려놓고 손을 기울여 다시 쥔 뒤 놓기
    # 먼 자리 다시 쥐기의 열기를 팔을 멈추지 않고 (내려놓은 뒤 빈손으로 다시 쥘 자리 위로 가며, PICK 미리 열기와 같음) — 한 번에 약 1.1 s (모델).
    #   격자 먼 줄 (정차 0.2575 → x 0.3175) 은 20° 손이 0.3075 까지라 매번 다시 쥠 (미션에 4–6 번). 실물 확인 뒤 켜기: ros2 param set /control_master place_far_open_on_way true
    place_far_open_on_way: false
    # 세우기 경로 전체를 위아래로 [mm]: 실물이 명령보다 약 10 mm 얕게 쥠 → −10 이면 시뮬 (윗면 아래 20 mm 쥐기) 과 같아짐
    #   더 내리지 말 것 (실물 −25: 경로 전체가 시뮬보다 15 mm 낮아 손가락이 박스를 긁음)
    standup_dz_mm: -10.0
    standup_reach_scale: 1.0    # 쥔 뒤 경로의 수평 이동 배율 (1 = 표 그대로). v11 표는 박스 안 (손끝 x ≤ 0.355) 이라 줄이지 않음 (v10 은 0.43 까지 뻗음)
    standup_tip_clear_mm: 2.0   # 표 점 중 손끝이 박스 윗면 + 이 값 (모델) 아래를 가리키면 그 높이까지 올림 (v10 표는 윗면 아래 10 mm 까지 가리킴)
    # 세우기 경로는 표 녹화 간격 (0.1 s) 그대로 재생 — 시뮬 재생: 녹화 속도 84 % · 15 °/s 로 늦추면 47 %. 1.5 = 1.5 배 느리게
    standup_time_scale: 1.0       # (강화학습 표만: 녹화 속도를 바꾸면 깨져서 2.5 배에서 뺌)
    standup_open_time_s: 0.5   # 여는 점에서 팔을 멈추지 않고 그리퍼만 이 시간에 다 엶 (여는 점에서 1.2 s 멈추면 시뮬 48 %)
    standup_speed_dps: 15.0    # (세우기 경로 점에는 안 씀 — 위 시간 간격이 정함)
    # 표 칸과 실제 퍽 차이 한도. 경로 전체를 실제 퍽으로 옮기므로 사실상 풂 — 6 mm 일 때 표가 빈 자리 (0.258, −0.008) 를 13 mm 차로 거절
    standup_max_gap_mm: 50.0
    standup_max_gap_deg: 45.0
    # 세운 뒤 바로 다시 쥠 (true) · LOOK 자세에서 끝내고 다음 pick det 로 카메라로 다시 재서 집음 (false, 기본 — 선 자리가 시뮬에서 90 % 12 mm 안)
    standup_regrasp: false
    # 쥐기 뒤 확인 (세우기 경로 전): 손끝이 쥐는 자리에서 이보다 멀거나 · 그리퍼가 이보다 닫히면 멈춤
    standup_reach_tol_mm: 15.0   #  손 도달 허용치 (손가락이 퍽 위에 얹히면 약 17 mm)
    standup_grip_min_m: -1.0     # 끔 (빈손이어도 멈추지 않음). 켜려면 0.001
    # 먼 · 옆 퍽 붙은 선 퍽 집기 (11-10 새벽 강화학습: 시뮬 성공 88.9 %, 네모 80.5 %) — 표 config/farpick/farpick_paths_ok75_nbr_none.txt · _nbr_000 … _nbr_315.txt
    #   (이웃 퍽 방향 base_link 45° 간격, 면 사이 3 mm 네모 이웃, standup_paths.txt 와 같은 형식). LOOK (옆 보기) 자세에서 표 그대로 재생:
    #   위 → 0.3 s 멈춤 → 쥐기 → 닫기 (팔 멈춤, 빈손 검사) → 들기, 그 뒤는 지금 PICK 과 같은 마무리. 쥔 깊이 · 기울임을 기록해 STORE 가 storeheld 경로를 고름
    farpick_dir: ""              # 표 폴더. "" = standup_paths_file 과 같은 폴더의 farpick/. 파일이 없으면 경고만 (기능 끔)
    farpick_mode: auto           # auto = 선 퍽 PICK 에서 이웃이 면 사이 farpick_touch_mm 안이거나 · 지금 계획이 거절될 때 먼저 시도 (손만 기울이면 되는 퍽은 기울여 쥐고 다시 쥠) (안 되면 지금 흐름), always = 표에 맞는 칸이 있으면 늘, off = 안 씀
    farpick_face_tol_deg: 0.0    # 11-10 12:2x: 끔 (90) — 기울인 손도 손가락을 면에 맞춤 (arm_kinematics pick_poses) → 표 (손목 76° 돌림) 안 씀. 그 전 10: 손을 기울여야 하는 네모가 닫힘축 (접선) 과 이만큼 넘게 틀어지면 먼 퍽 표 먼저 (기울인 손은 손목을 못 돌려 모서리를 침, 11-10 실물 18.8°)
    farpick_nbr_max_m: 0.06      # 목표 퍽 중심에서 이 안의 가장 가까운 이웃 방향으로 표를 고름 (없으면 nbr_none)
    farpick_max_gap_mm: 12.0     # 표 칸과 잰 퍽 차이 한도 (칸 → 퍽으로 경로 전체를 옮김), 넘으면 그 표 안 씀
    farpick_max_gap_deg: 8.0     # 네모 면 방향 차이 한도 (90° 주기, 원기둥은 안 봄)
    farpick_touch_mm: 10.0       # auto: 이웃과 면 사이가 이 안이면 (붙은 퍽) 먼 퍽 표 먼저
    farpick_regrasp: true        # 표로 기울여 쥔 퍽 → 가까운 빈 자리에 세워 내려놓고 수직 손으로 50 mm 다시 쥠 (11-10 10:05 실물: 22 mm · 27° 로 대각 넣기 실패). false = 쥔 그대로 STORE (store_<칸>_d40_tilt)
    farpick_regrasp_tilt_dev: 5.0  # 표로 쥔 기울임 (예 27°) 과 내려놓는 손 기울임 (10° 단계) 차 허용 [°]. 11-10 10:25: 0.5 면 놓을 자세가 없어 예전 흐름으로 감
    regrasp_put_clear_mm: 8.0      # 다시 쥐기 전 내려놓을 때 퍽 바닥을 박스 윗면 위 8 mm 에서 놓음 (11-10: 2 mm 면 눌러서 손가락 안쪽 대각선이 퍽을 밈). 주사위 PLACE 는 그대로
    regrasp_offset_mm: [-7.0, 0.0]   # 세워 놓은 퍽을 수직으로 다시 쥐는 점 [앞, 왼쪽] mm (실행 중 ros2 param set 가능). 11-10: 2 mm 앞 쥠은 한 번만 → 0
    pick_prefer_tangent: true      # 이웃 없는 선 퍽: 손목을 덜 돌리는 닫힘 방향 먼저 (11-10: 혼자 있는 네모를 손목 +79° 로 쥐어 돌림 보정 11 mm 가 들어가 옆으로 비켜 쥠)
    # 쥐기 (닫기) 뒤 빈손 문턱 [m]: 그리퍼 실측이 이보다 더 닫혔으면 퍽을 못 쥔 것 → PICK (받침 세우기 · 보통 집기 · 다시 쥐기) 을 쥐기 높이 위 점까지만 올리고 실패로 끝
    #   (11-09 21:4x 실물: 누운 퍽 끝을 놓쳐 빈손으로 받침 넣기 · 꽂기를 끝까지 해 팔이 퍽 · 박스를 침, 두 번). 값 = 끝까지 닫힘 gripper_close −0.0016 과
    #   퍽에 닿은 자리 약 0.0046 (쥔 채 실측, park_loose_grip_m 주석) 의 가운데 = HOME 의 "반쯤 닫힘" 기준 (gripper_close + 0.003) 과 같음. 실측 없으면 안 봄. −1 = 끔
    grasp_empty_m: 0.0003   # 11-09 22:2x: 원기둥 (Ø30, 네모보다 4.8 mm 좁음) 을 쥐면 실측이 약 0.002 로 더 닫힐 수 있어 빈손 (−0.0016) 과의 가운데로 낮춤

    # 고정 자세표
    #   - 팔을 수평으로 쭉 뻗지 않는다 (손목 모터 82 g + 판 + 그리퍼 44 mm 전진 → 어깨 부담 ↑)
    #     → 전부 "팔을 굽혀 위에서 내려 잡는" 모양
    #   - 손목 비틀기(joint5)는 ±90° 안 (케이블 꼬임). 원기둥은 0, 직육면체는 ±45° 면 충분
    # 아래 값: 팔 받침 = 맨 위 판(바닥에서 16.4 cm), 앞쪽 x = +0.085 를 가정하고 손끝이 바로 아래를 보도록 계산
    #   목표: 손끝이 몸 중심 앞 0.25 m (몸 앞 끝에서 약 11 cm), 선반 8 cm + 퍽 6 cm 기준
    #         위 = 바닥에서 20 cm, 집기 = 11 cm (퍽 윗부분을 쥠), 놓기 = 11.5 cm
    # ⚠ 실물 선반 거리 · 팔 받침 위치가 정해지면 다시 잡을 것
    #    (팔을 손으로 원하는 자세에 두고 /joint_states 를 읽어 적는 게 가장 빠름)
    home_j1_offset_rad: 0.0261   # 11-10 14:1x 실물 +16 = 눈금 21 에 앉음 (전류 0, 손으로 맞춘 22) · 오른쪽 튀어나온 곳에 살짝 걸림 → +17. 검수 (Fable · Codex): 손으로 받침에 맞춘 J1 = 눈금 22 = HOME 목표 4 + 16 + 늘 남는 2 → +16 틱. 받침 구간 점만 이름으로 (칸 경로 안 바뀜)
    home_j5_offset_rad: 0.0     # HOME · 받침 구간 점의 손목 (J5) [rad], 켤 때 한 번
    poses:
      home:        [-0.0061, -1.4511, 0.9511, -0.1181, 0.0230]   # 그리퍼 받침 위 접은 자세 (틱 4084 · 1102 · 2668 · 1971 · 2063, hardware_map initial 과 같음)
      pick_above:  [0.0,     0.7977, -1.3806,  0.5139, -0.0445]  # 박스 앞 퍽 (0.235, 0) 윗면 위 40 mm, 손 수직 · 처짐 앞먹임 포함 엔코더 목표
      pick_down:   [0.0,     0.6673, -0.5538, -0.1841, -0.0445]  # 같은 퍽 윗면 아래 30 mm (실제 약 25 mm 쥠) — 시험용 고정 자세, ArmTask PICK 은 pick_heights_mm (−40) IK 를 씀
      place_above: [-0.9465, -0.2638, -0.3191,  0.5553,  0.5630]  # 적재함 S9 칸 위 (퍽 바닥이 컵 위 약 8 mm) — 칸마다 다름, 실제 적재는 arm_tests/rack_load 계획
      place_down:  [-0.9465, -0.3513,  0.0169,  0.3037,  0.5630]  # A 칸 안 놓는 자리 (퍽 바닥이 칸 바닥 위 10 mm)

    # =========================== 차례 (한 번에 한 무리, D15) ===========================
    start_locked: true             # 켤 때 바퀴 잠금 (팔 자세를 모름). 첫 HOME 작업이 끝나야 DRIVE
                                   #   planning 없이 몸만 시험할 땐: ros2 action send_goal /arm_task interfaces/action/ArmTask "{task: 0}"
    turn_publish_hz: 10.0          # 차례를 계속 보내는 주기 (swerve_controller 는 0.5 s 안 오면 잠금)
    settle_s: 0.5                  # 팔 작업이 오면 바퀴를 세우고, 몸통이 이만큼 계속 멈춰 있어야 팔 시작 [s]
                                   #   (센 시간은 swerve_controller 의 "잠갔음" 답을 받은 뒤부터)
    still_linear: 0.01             # [m/s] /odom 이 이보다 느리면 "멈춤"
    still_angular: 0.05            # [rad/s]
    odom_timeout_s: 0.5            # /odom 의 측정 시각이 이만큼 오래되면 "멈췄는지 모름" → 팔 시작 안 함
    look_near_tilt_deg: 10.0   # 11-11 추가
    rack_fit_persist: false   # 11-11 추가
    fail_fold_s: 3.0   # 11-11 추가
    hw_status_optional: true   # 11-11 추가
    regrasp_visual: true   # 11-11 추가
    grasp_width_check: true   # 11-11 추가
    grasp_retry_max: 1   # 11-11 추가
    store_close_rise_mm: 50.0   # 11-11 추가
    store_close_side_mm: 40.0   # 11-11 추가
    lyingpick_use: true   # 11-11 추가
    lyingpick_dz_mm: 0.0   # 11-11 추가
    lyingpick_hover_mm: 4.0   # 11-11 추가
    store_match_grip_extra_mm: -5.0   # 11-11 추가
    grasp_width_cylinder_mm: 33.5   # 11-11 추가
    store_contact_current_a: 0.55   # 11-11 추가
    store_contact_retry: false   # 11-11 추가
    store_contact_err_deg: 2.0   # 11-11 추가
    store_contact_height_mm: 3.0   # 11-11 추가
    store_recover: true   # 11-11 추가

# 손목 카메라 홈 사진 보정 (manipulation camera_drift_node) — 팔이 홈에 멈출 때마다 기준 사진 (config/camera_home_ref.png, 잘 될 때)
#   과 비교해 카메라가 손목에서 돈 만큼 /wrist_cam/drift → control_master 가 손목 검출을 되돌림 (wrist_cam_drift_correct)
#   새 기준: 집기 · 적재가 잘 되는 상태에서 홈에 두고 ros2 service call /camera_drift_node/save_reference std_srvs/srv/Trigger
camera_drift_node:
  ros__parameters:
    home_q: [-0.0046, -1.4511, 0.9434, -0.1166, 0.0215]   # 홈 자세 실측 (같음)
    home_tol_rad: 0.01
    min_points: 100000   # 11-09 밤: 자동 측정 끔 (퍽 쥔 HOME 사진으로 보정이 1.44 → 3.22° 로 흔들려 집기가 4–12 mm 빗나감). 보정은 ~/.ros/camera_drift 의 1.44° 고정
    max_deg: 8.0        # 이보다 크게 돌았으면 보정 안 하고 경고 (경첩 · 나사 확인)
    max_resid_px: 8.0
