# slam_toolbox 지도 만들기 (2026-10-31, 젯슨). bringup/launch/slam.launch.py slam_mode:=mapping 이 씀.
# 값 = 10-27 젯슨 매핑(48 구간 · 759 s, 지도 정상) 설정 그대로 + 아래만 바꿈:
#   map_update_interval 2.0 → 1.0 (지도 그리기 주기 — 그래프 · 위치 추정에는 영향 없음, 젯슨 CPU 는 실물에서 확인). transform_timeout 0.2 (스캔 약 10 Hz · /odom 100 Hz).
# 스캔 = 앞 · 뒤 LDS-03 (coin_d4_driver multi_coin_d4_node) 을 bringup/scan_merger.py 가 몸 중심 360° 로 합친 /scan (frame base_footprint, 2026-10-31).
# TF 주인: odom→base_footprint = swerve_controller, base_footprint→lidar_front_link = robot_state_publisher (URDF), map→odom = slam_toolbox.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan                # 앞 · 뒤 합친 360° (bringup/scan_merger.py, 2026-10-31)
    use_map_saver: true
    throttle_scans: 1
    transform_publish_period: 0.02
    restamp_tf: false
    map_update_interval: 1.0
    resolution: 0.025          # 11-01: 시뮬 지도(maze_dice_map 0.025)와 맞춤 · 통로 1 m 경기장
    min_laser_range: 0.05
    max_laser_range: 8.0   # 11-01: 시뮬 검증(sim_slam_dice_20261031 6절) — 반복 구조에서 거짓 고리 닫힘(74~153 cm 점프) 방지 · LDS-03 한계 8 m
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05   # 11-01: 시뮬 검증(sim_slam_dice_20261031 6절) — 반복 구조에서 거짓 고리 닫힘(74~153 cm 점프) 방지
    minimum_travel_heading: 0.05   # 11-01: 시뮬 검증(sim_slam_dice_20261031 6절) — 반복 구조에서 거짓 고리 닫힘(74~153 cm 점프) 방지
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 1.5   # 11-01: 시뮬 검증(sim_slam_dice_20261031 6절) — 반복 구조에서 거짓 고리 닫힘(74~153 cm 점프) 방지
    do_loop_closing: true
    loop_match_minimum_chain_size: 15   # 11-01: 시뮬 검증(sim_slam_dice_20261031 6절) — 반복 구조에서 거짓 고리 닫힘(74~153 cm 점프) 방지
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.55   # 11-01: 시뮬 검증(sim_slam_dice_20261031 6절) — 반복 구조에서 거짓 고리 닫힘(74~153 cm 점프) 방지
    loop_match_minimum_response_fine: 0.65   # 11-01: 시뮬 검증(sim_slam_dice_20261031 6절) — 반복 구조에서 거짓 고리 닫힘(74~153 cm 점프) 방지
    correlation_search_space_dimension: 0.3   # 11-01: 시뮬 검증(sim_slam_dice_20261031 6절) — 반복 구조에서 거짓 고리 닫힘(74~153 cm 점프) 방지
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
