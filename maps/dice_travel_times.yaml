# dice 경기장 노드 사이 이동 시간 [s] (planning transfer_planner 비용표)
# arena5 실물 지도 기준
#   경로 길이 = Nav2 planner_server (NavFn, 레포 config/nav2.yaml, global costmap = arena5 static + inflation, live 라이다 층 없음) 에
#     compute_path_to_pose 로 쌍마다 받음. rl_nav 와 같게 출발 = 정차점 (경로 안 나오면 뒤 0.05 m 씩 빠져나옴, B4 만 0.10),
#     목표 = 정차점 뒤 2.5 cm (dock_nav_back), 끝에 정차점까지 더함
#   지점 = arena5 에서 잰 박스 실제 자리 + 정차 0.2575 m (~/Downloads/dice_map_arena5.yaml), 면 = B1–B4 · L1–L3 남쪽, B5 · B6 서쪽 (경기장 기준)
#   시간 = 거리 / 0.255 m/s (주행 상한, controllers.yaml max_linear) + 정차 방향 차이 / 0.5 rad/s (회전을 따로 더함 = 회전 적은 순서를 고르게). S 도착은 방향 무관 (회전 0)
#   0.255 는 상한이라 실제보다 짧음 → 실물 주행 시간으로 바꿀 것
# 노드: S = 출발점, B1–B6 = 시작 박스 정차점, L1–L3 = 장소 정차점
# 정차 · 팔 동작 시간은 가정값 (control 실측 전)
