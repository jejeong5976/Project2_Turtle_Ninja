# dice_map.yaml — 발제 v5 '주사위 기억 로봇' 경기장 좌표 (planning dice 흐름이 읽음, 설명 dice_map.hpp)
# 좌표: 경기장 프레임 (왼쪽 아래 기둥 = 원점, +X 오른쪽, +Y 위), m · rad
# 출처: 발제 v5 p.8 (박스 · 장소 · 출발 · 바코드), 정차 자세 = sim/robot_sim/results/dice_paths.json
#       정차 거리 (박스 중심 → 로봇 중심) 0.2575 m: 차체 앞 끝 0.145 ↔ 박스 면 1 cm, 먼 줄 PLACE 손 30° 다시 쥐기가 닿는 거리
#       → Nav2 목표 = 정차점 뒤 2.5 cm (dock_nav_back_m), 정차점 0.40 m 안 (dock_handoff_m) 에서 정밀 접근 dock_to_pose 로 넘김 (planning.yaml)
#  맵 공개 · 매핑 뒤 확인: 정차 자세가 실제 박스 · 태그 앞에 맞는지, map_from_arena

# map 프레임 ← 경기장 프레임. start = 매핑을 출발 자세에서 시작함 (SLAM map 원점 = 시작 자세)
# 시뮬 지도 maps/maze_dice_map 은 경기장 중심 원점 → [-2.202, -3.152, 0.0]
map_from_arena: start

start: [0.734, 0.950, 3.1416]          # 출발 중심 (734, 950) mm, −X 방향 = 신호등 쪽
# 바코드 (80, 650, 450) mm 를 손목으로 읽는 자리: 차체 전체가 출발 구역 (434–1034, 650–1250) 안, 바코드는 왼쪽 0.15 m 앞 0.50 m
#   팔 LOOK_BARCODE 로 카메라를 약 0.2 m 앞까지 내밀어 정면으로 봄 (URDF 순기구학 탐색, 1.7 px/모듈, 그리퍼 가림 미확인)
barcode_view: [0.584, 0.800, 3.1416]
box_radius: 0.15                       # 박스 LOOK 때 박스 중심에서 이 반경 안 퍽 = 그 박스 퍽
box_size: 0.205                        # 박스 한 변 [m]
box_approach_m: 0.0                    # 박스 정차 마지막 접근 (Nav2 는 이만큼 앞에서 멈추고 앞쪽 라이다로 면까지 똑바로 붙음, 0.10 권장). 0 = 끔 — 실물 확인 전이라 꺼 둠

boxes:                                 # 시작 박스 205×205×70 mm, 퍽 2 개 (중심 X ±40 mm)
  B1: {center: [1.468, 0.950], stop: [1.468, 0.6925, 1.5708]}
  B2: {center: [3.670, 3.152], stop: [3.670, 2.8945, 1.5708]}
  B3: {center: [2.936, 5.354], stop: [2.936, 5.0965, 1.5708]}
  B4: {center: [0.734, 5.354], stop: [0.734, 5.0965, 1.5708]}
  B5: {center: [2.202, 5.354], stop: [1.9445, 5.354, 0.0]}           # 서쪽 입구에서 +X 를 봄
  B6: {center: [3.670, 3.886], stop: [3.4125, 3.886, 0.0]}

places:                                # 주사위 격자 중심 (간격 60 mm), stop yaw = 보는 방향 (관찰 원 → 중심)
                                       # 관찰 팔 자세 = LOOK (격자 중심이 정차점 앞 0.2575 m), 세 곳 같음
  L1: {center: [3.670, 0.950], stop: [3.670, 0.6925, 1.5708], top_z: 0.07}   # 남쪽에서 +Y 를 봄 (arena5 planner_server 시간표로 순서 · 면 최적화), 태그 12 = 박스 윗면
  L2: {center: [2.202, 3.495], stop: [2.202, 3.2375, 1.5708], top_z: 0.07}   # 남쪽에서 +Y 를 봄 (arena5 순서 · 회전 최적화). 태그 13 = 박스 윗면 (205 박스)
  L3: {center: [3.670, 5.354], stop: [3.670, 5.0965, 1.5708], top_z: 0.07}   # 남쪽에서 +Y 를 봄, 태그 14 = 박스 윗면
