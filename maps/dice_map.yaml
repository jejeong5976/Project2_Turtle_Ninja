# dice_map.yaml — 발제 v5 '주사위 기억 로봇' 경기장 좌표 (planning dice 흐름이 읽음, 설명 dice_map.hpp)
# 좌표: 경기장 프레임 (왼쪽 아래 기둥 = 원점, +X 오른쪽, +Y 위), m · rad
# 출처: 발제 v5 p.8 (박스 · 장소 · 출발 · 바코드), 정차 자세 = sim/robot_sim/results/dice_paths.json
#       (maps/dice_travel_times.yaml 이동 시간을 잰 자리와 같음. 바꾸면 시간표도 다시 잴 것)
# 11/4 맵 공개 · 매핑 뒤 확인: 정차 자세가 실제 박스 · 태그 앞에 맞는지, map_from_arena

# map 프레임 ← 경기장 프레임. start = 매핑을 출발 자세에서 시작함 (SLAM map 원점 = 시작 자세)
# 시뮬 지도 maps/maze_dice_map 은 경기장 중심 원점 → [-2.202, -3.152, 0.0]
map_from_arena: start

start: [0.734, 0.950, 3.1416]          # 출발 중심 (734, 950) mm, −X 방향 = 신호등 쪽
# 바코드 (80, 650, 450) mm 를 손목으로 읽는 자리: 차체 전체가 출발 구역 (434–1034, 650–1250) 안, 바코드는 왼쪽 0.15 m 앞 0.50 m
#   팔 LOOK_BARCODE 로 카메라를 약 0.2 m 앞까지 내밀어 정면으로 봄 (URDF 순기구학 탐색 2026-11-01, 1.7 px/모듈, 그리퍼 가림 미확인)
barcode_view: [0.584, 0.800, 3.1416]
box_radius: 0.15                       # 박스 LOOK 때 박스 중심에서 이 반경 안 퍽 = 그 박스 퍽

boxes:                                 # 시작 박스 205×205×70 mm, 퍽 2 개 (중심 X ±40 mm)
  B1: {center: [1.468, 0.950], stop: [1.468, 0.6565, 1.5708]}
  B2: {center: [3.670, 3.152], stop: [3.670, 2.8585, 1.5708]}
  B3: {center: [2.936, 5.354], stop: [2.936, 5.0605, 1.5708]}
  B4: {center: [0.734, 5.354], stop: [0.734, 5.0605, 1.5708]}
  B5: {center: [2.202, 5.354], stop: [1.9085, 5.354, 0.0]}           # 서쪽 입구에서 +X 를 봄 (2026-11-02, 옛 북쪽 [2.202, 5.6475, -1.5708]). 이동 시간표 B5 행 · 열 재측정함
  B6: {center: [3.670, 3.886], stop: [3.3765, 3.886, 0.0]}

places:                                # 주사위 격자 중심 (간격 60 mm), stop yaw = 보는 방향 (관찰 원 → 중심)
  L1: {center: [3.670, 0.950], stop: [3.3765, 0.950, 0.0], top_z: 0.07}      # 박스 서쪽 면 태그 12
  L2: {center: [2.202, 3.700], stop: [2.202, 4.096, -1.5708], top_z: 0.07}   # 중앙 받침대 북쪽 면 태그 13
  L3: {center: [3.670, 5.354], stop: [3.670, 5.0605, 1.5708], top_z: 0.07}   # 박스 남쪽 면 태그 14
